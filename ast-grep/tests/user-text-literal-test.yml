id: user-text-literal
valid:
  - 'fn f() { println!("{}", value); }'
  - 'fn f() { println!("ok"); }'
  - 'fn f() { tracing::info!("loaded the config"); }'
  - 'fn f() { panic!("never reached here"); }'
  - 'fn f() { cmd.arg("--flag"); }'
  - 'fn f() { cmd.help(HELP.as_static()); }'
  - 'fn f() { CliError::new("usage", text(&Msg::A)); }'
  - 'fn f() { CliError::new(code, message); }'
  - 'fn f() { CliError::new("usage", render(&m)); }'
  - 'fn f() { CliError::escaping("usage", raw); }'
  - 'fn f() { CliError::new("pass paths", message); }'
  - 'fn f() { Other::new("usage", "not a cli error"); }'
  - |
    #[cfg(test)]
    mod tests {
        fn f() { println!("some test output"); }
    }
invalid:
  - 'fn f() { println!("cannot read the file"); }'
  - 'fn f() { eprintln!("warning: {} is stale", name); }'
  - 'fn f() { write!(out, "found {} problems", n)?; }'
  - 'fn f() { let s = format!("cannot read {}", name); }'
  - 'fn f() { Command::new("x").help("Print the report"); }'
  - 'fn f() { Command::new("x").about("Lint prose"); }'
  - 'fn f() { CliError::new("usage", "pass paths"); }'
  - 'fn f() { CliError::new("usage", format!("cannot read {}", name)); }'
  - 'fn f() { CliError::escaping("usage", "bad value"); }'
  - 'fn f() { CliError::escaping(code, format!("bad {}", v)); }'
  - 'fn f() { CliError::new(code, "x"); }'
  - |
    mod tests {
        fn f() { println!("not marked as test code"); }
    }
