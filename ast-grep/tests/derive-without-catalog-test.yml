id: derive-without-catalog
valid:
  - |
    #[derive(Debug, thiserror::Error, Catalog)]
    enum E { A }
  - |
    #[derive(Debug)]
    enum E { A }
  - |
    #[derive(Debug, Error, Catalog)]
    #[cfg(unix)]
    struct E;
  - |
    #[derive(Debug, Error)]
    #[derive(Catalog)]
    enum E { A }
  - |
    #[derive(Catalog)]
    #[derive(Debug, thiserror::Error)]
    enum E { A }
  - |
    #[derive(Debug, ErrorKind)]
    enum E { A }
  - |
    #[derive(
        Debug,
        thiserror::Error,
        Catalog,
    )]
    enum E { A }
invalid:
  - |
    #[derive(Debug, thiserror::Error)]
    enum E { A }
  - |
    #[derive(Debug, Error)]
    struct E;
  - |
    #[derive(
        Debug,
        thiserror::Error,
    )]
    enum E { A }
  - |
    #[derive(Debug)]
    #[derive(
        Clone,
        Error,
    )]
    enum E { A }
  - |
    #[derive(Debug, Error, NotCatalog)]
    enum E { A }
