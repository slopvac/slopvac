id: user-text-literal
language: rust
severity: error
message: Put user-facing text in the crate's message catalog, not in a literal at the call site.
note: >-
  Add a variant with `#[derive(Catalog)]` in the crate's `messages.rs` and render it. Tests,
  benches, examples, `cfg(test)` modules, `tracing` events and `panic!` are exempt. For a
  machine-format writer, add `// ast-grep-ignore: user-text-literal` above the call.
# The rule applies only to crates that adopted the registry. Add a crate's glob here when
# it migrates; the last step widens this to every crate.
files:
  - crates/slopvac/src/report/**
  - crates/slopvac-agents/src/**
  - crates/slopvac-config/src/**
  - crates/slopvac-diagrams/src/**
  - crates/slopvac-engine/src/**
  - crates/slopvac-model/src/**
  - crates/slopvac-messages/src/**
  - crates/slopvac-report/src/**
  - crates/slopvac-lsp/src/**
  - crates/slopvac-update/src/**
  - crates/slopvac-parse/src/**
  - crates/slopvac-plugins/src/**
  - crates/slopvac-pos/src/**
  - crates/slopvac-sanitize/src/**
  - crates/slopvac-styles/src/**
  - crates/slopvac-terms/src/**
  - crates/slopvac-text/src/**
  - crates/slopvac-migrate/src/**
  - crates/slopvac/src/cli_messages.rs
  - crates/slopvac/src/errors.rs
  - crates/slopvac/src/output.rs
  - crates/slopvac/src/stdin.rs
  - crates/slopvac/src/init/mod.rs
  - crates/slopvac/src/generate.rs
  - crates/slopvac/src/summary.rs
  - crates/slopvac/src/update_notice.rs
  - crates/slopvac/src/redact.rs
ignores:
  # The form field labels go to GitHub issue forms, and open PR #798 edits the file.
  - crates/slopvac/src/report/fields.rs
  # Audit output is for contributors reading a failing test, not for users.
  - crates/slopvac-messages/src/audit.rs
  # A generated reference page: its prose is exempt because the prose gate covers it.
  - crates/slopvac-terms/src/reference.rs
  # A generated reference page: its prose is exempt because the prose gate covers it.
  - crates/slopvac-styles/src/reference.rs
  - "**/tests/**"
  - "**/benches/**"
  - "**/examples/**"
rule:
  any:
    - all:
        - kind: macro_invocation
        - has:
            field: macro
            regex: ^(print|println|eprint|eprintln|write|writeln|format)$
        - has:
            kind: string_literal
            regex: '[A-Za-z]{2,}[:,.]? +[A-Za-z{]'
            stopBy: end
    - all:
        - kind: call_expression
        - has:
            field: function
            kind: field_expression
            has:
              field: field
              regex: ^(help|about|long_about|long_help|before_help|after_help)$
        - has:
            field: arguments
            has:
              kind: string_literal
              regex: '[A-Za-z]{2,}[:,.]? +[A-Za-z{]'
    # The message argument (the second one, not counting comments) of
    # `CliError::new(code, message)` and `CliError::escaping(code, raw)`. The code argument
    # is not checked, and a message from a catalog render is not a literal. `Self::new` and
    # `Self::escaping` count only inside `impl CliError`.
    - all:
        - kind: call_expression
        - has:
            field: function
            kind: scoped_identifier
            all:
              - has:
                  field: name
                  regex: ^(new|escaping)$
              - has:
                  field: path
                  any:
                    - kind: identifier
                      regex: ^CliError$
                    - kind: scoped_identifier
                      has:
                        field: name
                        regex: ^CliError$
                    - all:
                        - kind: identifier
                          regex: ^Self$
                        - inside:
                            kind: impl_item
                            has:
                              field: type
                              matches: cli-type
                            stopBy:
                              kind: impl_item
        - has:
            field: arguments
            has:
              all:
                - nthChild:
                    position: 2
                    ofRule:
                      not:
                        any:
                          - kind: line_comment
                          - kind: block_comment
                - matches: cli-message
  not:
    inside:
      kind: mod_item
      follows:
        kind: attribute_item
        regex: cfg\(test\)
        stopBy: neighbor
      stopBy: end
# A literal message: a string, `concat!` or `format!`, alone or wrapped in a reference, a
# pair of parentheses, `.to_string()`, `.to_owned()`, `.into()` or `String::from`.
utils:
  # The type `CliError`, with or without a path before it.
  cli-type:
    any:
      - kind: type_identifier
        regex: ^CliError$
      - kind: scoped_type_identifier
        has:
          field: name
          regex: ^CliError$
  cli-message:
    any:
      - kind: string_literal
      - kind: raw_string_literal
      - kind: macro_invocation
        has:
          field: macro
          any:
            - kind: identifier
              regex: ^(format|concat)$
            - kind: scoped_identifier
              has:
                field: name
                regex: ^(format|concat)$
      - kind: parenthesized_expression
        has:
          matches: cli-message
      - kind: reference_expression
        has:
          field: value
          matches: cli-message
      - kind: call_expression
        all:
          - has:
              field: function
              kind: field_expression
              all:
                - has:
                    field: field
                    regex: ^(to_string|to_owned|into)$
                - has:
                    field: value
                    matches: cli-message
      - kind: call_expression
        all:
          - has:
              field: function
              kind: scoped_identifier
              all:
                - has:
                    field: name
                    regex: ^from$
                - has:
                    field: path
                    any:
                      - kind: identifier
                        regex: ^String$
                      - kind: scoped_identifier
                        has:
                          field: name
                          regex: ^String$
          - has:
              field: arguments
              has:
                matches: cli-message
