schema_version = 3
# Gate config for the generated reference pages (see .github/workflows/docs-site.yml).
# The pages are rule data rendered as Markdown. They run at the levels of the 2.x
# relaxed profile, which the style `core:legacy-relaxed` carries, and the page for
# the Unicode-dash rule must quote one dash in its example.
# `profile = "relaxed"` sets the gate thresholds and `styles` sets the rule levels,
# as `slopvac migrate --preserve-behavior` writes them.
profile = "relaxed"
styles = ["core:legacy-relaxed"]

[thresholds]
max_unicode_dashes = 1
