# reason = "Why the break is acceptable."
# approved_by = "reviewer name"

# The plugins amendment: one plugins group, kinds data and code, reserved core.
[[allow]]
file = "config.schema.json"
pointer = "/properties/packs"
kind = "property-removed"
reason = "The plugins amendment (slopvac-8l4.2.73) merges the separate packs array into the one plugins array. v3 is unreleased, so no shipped config uses it."
approved_by = "maintainer, relayed by the lead on 2026-11-18"

[[allow]]
file = "config.schema.json"
pointer = "/properties/plugins/items/$ref(config.schema.json#/$defs/Source)/properties/id/$ref(common.schema.json#/$defs/PluginId)/pattern"
kind = "pattern-changed"
reason = "The plugins amendment (slopvac-8l4.2.73, namespace rule slopvac-8l4.2.75) reserves `core` for the built-in plugin, so a plugin id or namespace may not be `core`. The new pattern also ends in (?![\\s\\S]) instead of $."
approved_by = "maintainer, relayed by the lead on 2026-11-18"

