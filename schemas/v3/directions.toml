# Which way each schema in this directory faces. scripts/contract/schema_compat.py reads it.
#
#   input   slopvac reads documents of this shape (configuration, rules, term lists).
#   output  slopvac writes documents of this shape (reports).
#   both    slopvac writes and reads it, or other tools exchange it with slopvac.
#
# A "both" schema follows the output rule. In an output schema a new enum value or an
# appended anyOf/oneOf branch breaks consumers, unless the position carries
# "x-slopvac-extensible": true. In an input schema both are allowed.
# Every schema file is listed here, and nothing else.

[directions]
"blocklist.schema.json" = "input"
"category.schema.json" = "input"
"common.schema.json" = "both"
"config.schema.json" = "input"
"doctor-report.schema.json" = "output"
"frontmatter.schema.json" = "input"
"genre.schema.json" = "input"
"lint-report.schema.json" = "output"
"plugin-index.schema.json" = "both"
"plugin-manifest.schema.json" = "input"
"plugin-protocol-codes.schema.json" = "output"
"plugin-protocol.schema.json" = "both"
"plugins-lock.schema.json" = "both"
"rule.schema.json" = "both"
"rules-output.schema.json" = "output"
"style.schema.json" = "input"
"tagger.schema.json" = "input"
"terms.schema.json" = "both"
