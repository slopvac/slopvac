schema_version = 3
id = "title-case-heading"
name = "Use sentence case in headings"
message = "title case: {match}"
severity = "suggestion"
scope = "heading"

[match]
kind = "pattern"
# \x{2014} is the PCRE2 spelling of U+2014. \s{1,8} keeps the lookbehind bounded.
pattern = '(?<=\x{2014}\s{1,8})(?!(?i:ALLOWED_WORDS)\b)[A-Z][a-z]+'
ignore_case = false

[match.placeholders]
ALLOWED_WORDS = "allowed-words"

[citation]
source = "Google developer style guide"
