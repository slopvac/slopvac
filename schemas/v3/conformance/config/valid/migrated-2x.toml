# Shape that `slopvac migrate` writes for a typical 2.x config.
profile = "normal"
exclude = [
  "**/node_modules/**",
  "packages/slopvac-lint/tests/fixtures/**",
  "CHANGELOG.md",
  ".beads/**",
]
schema_version = 3

[thresholds]
max_errors = 0

[categories]
"core:ste-descriptive" = "suggestion"
"core:ste-safety" = "error"
