# Curation spec for the eval corpus. `python -m evals.curate` reads this file.
#
# Every `files` source is pinned to the last commit before 2022-11-01 and keeps
# only repositories whose licence at that commit is known. `license` overrides
# the repository licence when a documentation tree carries its own (for example
# Kubernetes documentation is CC-BY-4.0 inside an Apache-2.0 repository).
# Committed copies are limited to permissive licences and 32 KiB; the rest stay
# in the cache.

# --- product -------------------------------------------------------------

[[source]]
name = "product: kubernetes concepts"
genre = "product"
repo = "kubernetes/website"
license = "CC-BY-4.0"
format = "markdown"
prefix = "content/en/docs/concepts/"
must = "workloads|services-networking|storage|configuration|scheduling|cluster-administration"
count = 10
max_bytes = 30000

