[package]
name = "slopvac"
description = "Command-line prose linter for AI-generated text patterns."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[package.metadata.dist]
dist = true

[lib]
name = "slopvac_cli"
path = "src/lib.rs"

[[bin]]
name = "slopvac"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dependencies]
clap.workspace = true
clap_complete = "4"
clap_mangen = "0.3.3"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
slopvac-agents.workspace = true
slopvac-lsp.workspace = true
slopvac-migrate.workspace = true
slopvac-model.workspace = true
slopvac-plugins.workspace = true
slopvac-report.workspace = true
slopvac-rules.workspace = true
slopvac-styles.workspace = true
slopvac-update.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "ansi",
  "fmt",
] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta.workspace = true
jsonschema.workspace = true
minisign.workspace = true
predicates = "3.1.4"
proptest.workspace = true
roxmltree.workspace = true
rstest.workspace = true
snapbox.workspace = true

[lints]
workspace = true
