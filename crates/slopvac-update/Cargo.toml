[package]
name = "slopvac-update"
description = "Update notices, install-method detection and `slopvac self update`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Opens `slopvac.toml` without blocking and reads it through the handle. The update lock opens
# its file with O_NOFOLLOW and compares the file owner with the current user.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[dependencies]
clap.workspace = true
crossbeam-channel.workspace = true
flate2.workspace = true
minisign-verify.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
# Fingerprints the executable for the update record (already a workspace dependency).
sha2.workspace = true
slopvac-fs.workspace = true
slopvac-messages.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
ureq.workspace = true

[dev-dependencies]
minisign.workspace = true
rstest.workspace = true

[lints]
workspace = true
