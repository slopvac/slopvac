# Built-in terms: stable product, language, protocol and acronym spellings.
#
# Provenance: authored for slopvac from each project's own published spelling.
# No third-party word list was copied, so no third-party licence applies; the
# file ships under the repository licence (Apache-2.0).
#
# Selection rules (reviewed by hand):
# - Names that are also ordinary words (Python, Java, Azure, Git, Maven) carry
#   `case_sensitive = true`: only the exact spelling is the term, so ordinary
#   prose never produces a finding. Names that are too common as plain words
#   (Go, Rust, Swift, Ruby, React, Windows, Spark, Express, Rails, Yarn, Jest,
#   Pandas, Vault, REST, ML, OS) are left out entirely.
# - Names the owner spells in lower case (npm, webpack, kubectl) list that
#   spelling as canonical plus a capitalised variant for sentence starts.
# - Rename-prone names are left out.
