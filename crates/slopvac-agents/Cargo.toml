[package]
name = "slopvac-agents"
description = "Agent guidance for slopvac: prime topics, harness setup and review."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Deterministic work measurements for tests; release builds leave this off.
test-counters = []

[dependencies]
cap-std.workspace = true
clap.workspace = true
minijinja.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
slopvac-config.workspace = true
slopvac-context.workspace = true
slopvac-fs.workspace = true
slopvac-messages.workspace = true
slopvac-migrate.workspace = true
slopvac-model.workspace = true
slopvac-packs.workspace = true
slopvac-sanitize.workspace = true
slopvac-text.workspace = true
slopvac-update.workspace = true
thiserror.workspace = true

[dev-dependencies]
rstest.workspace = true
serde-saphyr.workspace = true
# Enable counters for integration tests without changing the default features.
slopvac-agents = { path = ".", features = ["test-counters"] }
tempfile.workspace = true

[lints]
workspace = true
