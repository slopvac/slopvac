[package]
name = "slopvac-packs"
description = "Pack manifests and the namespaced registries that hold what packs provide."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test seams of this crate. Only the dev-dependency below enables it, so a release build has none.
test-support = ["slopvac-plugins/test-support"]

[dependencies]
cap-std.workspace = true
globset.workspace = true
regex.workspace = true
schemars.workspace = true
semver.workspace = true
serde_json.workspace = true
slopvac-config.workspace = true
slopvac-context.workspace = true
slopvac-fs.workspace = true
slopvac-messages.workspace = true
slopvac-model.workspace = true
slopvac-plugins.workspace = true
slopvac-rules.workspace = true
slopvac-sanitize.workspace = true
slopvac-styles.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
flate2.workspace = true
proptest.workspace = true
rstest.workspace = true
slopvac-packs = { workspace = true, features = ["test-support"] }
tar.workspace = true
tempfile.workspace = true

[lints]
workspace = true
