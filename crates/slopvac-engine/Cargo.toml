[package]
name = "slopvac-engine"
description = "The linting engine that applies rules to documents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
crossbeam-channel = { workspace = true }
frontmatter-spans = { workspace = true }
globset.workspace = true
ignore.workspace = true
pulldown-cmark = { workspace = true }
rayon = { workspace = true }
similar.workspace = true
slopvac-context = { workspace = true }
slopvac-diagrams = { workspace = true }
slopvac-model = { workspace = true }
slopvac-parse = { workspace = true }
slopvac-pos = { workspace = true }
slopvac-rules = { workspace = true }
slopvac-terms = { workspace = true }
slopvac-text = { workspace = true }
thiserror = { workspace = true }

# O_NONBLOCK, the effective user id and ACL attributes for `fix_file`; the process group
# kill and the no-follow open for the changed-line scope.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[dev-dependencies]
# The work-counter tests count the indexes a lint builds.
slopvac-model = { workspace = true, features = ["test-counters"] }
proptest.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tempfile.workspace = true
