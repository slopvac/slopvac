[package]
name = "slopvac-plugins"
description = "Plugin discovery and execution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The plugin launcher as its own program, for this package's tests. The
# `slopvac` binary runs the same code through `launch::intercept`.
[[bin]]
name = "slopvac-plugin-launcher"
path = "src/bin/slopvac-plugin-launcher.rs"
test = false
doc = false

[dependencies]
base64.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
crossbeam-channel.workspace = true
minisign-verify.workspace = true
rustix.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
ureq.workspace = true

# Polling a pidfd shows whether its process exited. The launcher points its
# own standard streams at /dev/null once the plugin holds them.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["event", "stdio"] }

# O_NONBLOCK for opens in `apply`, so a swapped-in FIFO cannot block them.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

# Windows has no stable safe call for a file's hard-link count.
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

[dev-dependencies]
minisign.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
