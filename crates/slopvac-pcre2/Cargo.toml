[package]
name = "slopvac-pcre2"
description = "Safe wrapper over the vendored PCRE2 with the match, depth, heap and JIT limits policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Pinned: 0.2.10 vendors PCRE2 10.46; the rules need >= 10.43 (slopvac-8l4.3.20).
pcre2-sys = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rstest = { workspace = true }

# The workspace sets `unsafe_code = "forbid"`, which no `allow` can override, so this
# crate cannot inherit the table. It repeats the workspace lints with one change:
# `deny` instead of `forbid`, so that only `src/ffi.rs` may opt in with `#![allow]`.
# Keep the other entries in step with the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
missing_crate_level_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Stricter than the workspace "warn".
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
