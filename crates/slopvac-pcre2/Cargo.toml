[package]
name = "slopvac-pcre2"
description = "Safe wrapper over the vendored PCRE2 with the match, depth, heap and JIT limits policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Pinned: 0.2.10 vendors PCRE2 10.46; the rules need >= 10.43 (slopvac-8l4.3.20).
pcre2-sys = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rstest = { workspace = true }

# The workspace sets `unsafe_code = "forbid"`, which no `allow` can override, so this
# crate cannot inherit the table. It repeats the workspace lints with one change:
# `deny` instead of `forbid`, so that only `src/ffi.rs` may opt in with `#![allow]`.
# Keep the other entries in step with the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
missing_crate_level_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allowed pedantic lints (each with its reason).
module_name_repetitions = "allow" # reason: crate-prefixed type names read better at call sites in a text-processing codebase
missing_errors_doc = "allow"      # reason: error enums are documented on the type, not on every fallible fn
missing_panics_doc = "allow"      # reason: panics are banned by lint instead; docs would duplicate that
# Restriction and nursery lints that guard against panics and silent failure.
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
mem_forget = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
clone_on_ref_ptr = "warn"
redundant_type_annotations = "warn"
redundant_clone = "warn"
use_debug = "warn"
string_add = "warn"
needless_pass_by_ref_mut = "warn"
expect_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
str_to_string = "warn"
wildcard_enum_match_arm = "warn"
as_conversions = "warn"
significant_drop_tightening = "warn"
option_if_let_else = "warn"
# Span and parser crates opt in with `#![warn(...)]` in lib.rs; the rest of the workspace
# does not index, slice or do offset arithmetic on untrusted text.
indexing_slicing = "allow"          # reason: span crates opt in
string_slice = "allow"              # reason: span crates opt in
arithmetic_side_effects = "allow"   # reason: span crates opt in
# Skipped restriction lints.
missing_docs_in_private_items = "allow" # reason: rustc `missing_docs` covers the public API; private docs are noise
missing_assert_message = "allow"        # reason: assertions in tests name the behaviour through the test name
undocumented_unsafe_blocks = "deny"
impl_trait_in_params = "allow"          # reason: `impl Trait` arguments are idiomatic and read better than generics
renamed_function_params = "allow"       # reason: trait impls rename parameters to fit the implementing type
multiple_unsafe_ops_per_block = "deny"
