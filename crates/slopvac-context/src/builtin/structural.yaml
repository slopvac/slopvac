# Built-in structural taggers, as `tagger.schema.json` defines them with `when`. They read
# the heading path, admonition titles, front matter, the file path or the block kind.
# Patterns are PCRE2 and case-insensitive. Each entry is one tagger file; the list is a
# bundle for the built-in pack.

# change-note: headings, version headings, admonitions, version tokens, files.
- schema_version: 3
  id: change-note-heading
  tag: change-note
  scope: section
  confidence: 0.9
  when:
    heading_path: '\b(?:breaking|upgrad\w*|migrat\w*|what.?s new|release notes?|changelog|changes? in|deprecat\w*|compatibility notes?|version history)\b'

- schema_version: 3
  id: change-note-changelog-heading
  tag: change-note
  scope: section
  confidence: 0.9
  when:
    heading_path: '^\W*(?:added|changed|fixed|removed)\W*$'

- schema_version: 3
  id: change-note-version-heading
  tag: change-note
  scope: section
  confidence: 0.9
  when:
    heading_path: '^\W*(?:version\s+|v)?\d+\.\d+(?:\.\d+)?\b'

- schema_version: 3
  id: change-note-admonition
  tag: change-note
  scope: paragraph
  confidence: 0.9
  when:
    admonition_title: '\b(?:changed|deprecated|breaking)\b|\bv?\d+\.\d+'

- schema_version: 3
  id: change-note-file
  tag: change-note
  scope: document
  confidence: 0.7
  when:
    path: '(?:^|/)(?:changelog|changes|history|news|releases?|upgrading|migration)[^/]*$'

# procedure, safety, example, quote, generated.
- schema_version: 3
  id: procedure-heading
  tag: procedure
  scope: section
  confidence: 0.8
  when:
    heading_path: '\b(?:procedures?|steps?|install(?:ation)?|set ?up|getting started|instructions|how to|walkthrough)\b'

- schema_version: 3
  id: safety-admonition
  tag: safety
  scope: paragraph
  confidence: 0.95
  when:
    admonition_title: '^\W*(?:warning|danger|caution)\b'

- schema_version: 3
  id: safety-heading
  tag: safety
  scope: section
  confidence: 0.8
  when:
    heading_path: '\b(?:safety|warnings?|cautions?)\b'

- schema_version: 3
  id: example-heading
  tag: example
  scope: section
  confidence: 0.8
  when:
    heading_path: '^\W*(?:examples?|sample|samples|example usage)\b'

- schema_version: 3
  id: example-admonition
  tag: example
  scope: paragraph
  confidence: 0.9
  when:
    admonition_title: '^\W*examples?\b'

- schema_version: 3
  id: quote-block
  tag: quote
  scope: paragraph
  confidence: 1.0
  when:
    block_kind: quote

- schema_version: 3
  id: generated-heading
  tag: generated
  scope: section
  confidence: 0.8
  when:
    heading_path: '\b(?:auto-?generated|generated (?:by|from|file|section|reference))\b'

- schema_version: 3
  id: generated-frontmatter
  tag: generated
  scope: document
  confidence: 0.95
  when:
    front_matter:
      key: generated
      matches: '^(?:true|yes)$'

- schema_version: 3
  id: generated-notice
  tag: generated
  scope: paragraph
  confidence: 0.8
  when:
    sentence: '\b(?:this file is (?:auto-?)?generated|auto-?generated (?:file|by)|do not edit (?:this|by hand))\b'
