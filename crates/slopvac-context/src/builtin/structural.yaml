# Built-in structural taggers. They read the heading path, admonition titles, front matter,
# the file path or the block kind, which `tagger.schema.json` taggers cannot. This is an
# internal format and not a pack artifact. Patterns are PCRE2 and case-insensitive.

# change-note: headings, version headings, admonitions, version tokens, files.
- id: change-note-heading
  kind: change-note
  scope: section
  confidence: 0.9
  when:
    heading_path: '\b(?:breaking|upgrad\w*|migrat\w*|what.?s new|release notes?|changelog|changes? in|deprecat\w*|compatibility notes?|version history)\b'

- id: change-note-changelog-heading
  kind: change-note
  scope: section
  confidence: 0.9
  when:
    heading_path: '^\W*(?:added|changed|fixed|removed)\W*$'

- id: change-note-version-heading
  kind: change-note
  scope: section
  confidence: 0.9
  when:
    heading_path: '^\W*(?:version\s+|v)?\d+\.\d+(?:\.\d+)?\b'

- id: change-note-admonition
  kind: change-note
  scope: paragraph
  confidence: 0.9
  when:
    admonition_title: '\b(?:changed|deprecated|breaking)\b|\bv?\d+\.\d+'

- id: change-note-file
  kind: change-note
  scope: document
  confidence: 0.7
  when:
    path: '(?:^|/)(?:changelog|changes|history|news|releases?|upgrading|migration)[^/]*$'

# procedure, safety, example, quote, generated.
- id: procedure-heading
  kind: procedure
  scope: section
  confidence: 0.8
  when:
    heading_path: '\b(?:procedures?|steps?|install(?:ation)?|set ?up|getting started|instructions|how to|walkthrough)\b'

- id: safety-admonition
  kind: safety
  scope: paragraph
  confidence: 0.95
  when:
    admonition_title: '^\W*(?:warning|danger|caution)\b'

- id: safety-heading
  kind: safety
  scope: section
  confidence: 0.8
  when:
    heading_path: '\b(?:safety|warnings?|cautions?)\b'

- id: example-heading
  kind: example
  scope: section
  confidence: 0.8
  when:
    heading_path: '^\W*(?:examples?|sample|samples|example usage)\b'

- id: example-admonition
  kind: example
  scope: paragraph
  confidence: 0.9
  when:
    admonition_title: '^\W*examples?\b'

- id: quote-block
  kind: quote
  scope: paragraph
  confidence: 1.0
  when:
    block_kind: quote

- id: generated-heading
  kind: generated
  scope: section
  confidence: 0.8
  when:
    heading_path: '\b(?:auto-?generated|generated (?:by|from|file|section|reference))\b'

- id: generated-frontmatter
  kind: generated
  scope: document
  confidence: 0.95
  when:
    frontmatter:
      key: generated
      matches: '^(?:true|yes)$'

- id: generated-notice
  kind: generated
  scope: paragraph
  confidence: 0.8
  when:
    sentence: '\b(?:this file is (?:auto-?)?generated|auto-?generated (?:file|by)|do not edit (?:this|by hand))\b'
