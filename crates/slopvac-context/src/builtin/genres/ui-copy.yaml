schema_version: 3
id: ui-copy
description: UI strings, error messages and CLI help.
profile: normal
detect:
  min_score: 3
  signals:
    - { kind: path, glob: '**/{ui-copy,ux-writing,microcopy,strings,messages}{/**,[-_.]*,[-_.]*/**}', weight: 3 }
    - { kind: front-matter, key: type, equals: ui-copy, weight: 3 }
