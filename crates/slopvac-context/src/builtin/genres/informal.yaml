schema_version: 3
id: informal
description: Immediate context. Issue comments, discussions, blogs, drafts.
profile: relaxed
detect:
  min_score: 3
  signals:
    - { kind: path, glob: '**/{blog,post,posts,draft,drafts,note,notes,discussion,discussions}/**', weight: 3 }
    - { kind: front-matter, key: status, equals: draft, weight: 3 }
