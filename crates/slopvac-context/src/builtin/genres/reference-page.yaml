schema_version: 3
id: reference-page
extends: [consumer]
description: Diataxis reference. Neutral, complete description of the machinery.
detect:
  min_score: 3
  signals:
    - { kind: path, glob: '**/cli/**', weight: 3 }
    - { kind: heading, pattern: '^\W*(?:options|parameters|configuration|settings|fields)\W*$', weight: 1.5 }
