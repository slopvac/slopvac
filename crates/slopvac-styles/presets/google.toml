# Google developer documentation style guide preset.
#
# Attribution: this preset encodes the parts of the Google developer
# documentation style guide (https://developers.google.com/style) that slopvac
# can check. The guide is licensed under CC BY 4.0
# (https://creativecommons.org/licenses/by/4.0/). The rule choices below are
# slopvac's own reading of it; Google does not endorse them.
#
# Coverage is partial on purpose. The guide permits "ad hoc" and gendered
# pronouns for people whose gender is known, and it names click and select by
# device. The 2.x rules for Latin phrases, pronouns and device wording are
# broader than the guide, so this preset leaves them alone. Each policy has one
# checker, so a single mistake yields a single finding.
schema_version = 3
description = "Google developer documentation style: sentence-case headings, semicolons allowed, no vertical-list requirement, no Latin abbreviations, inclusive terms."
conflicts = ["ste"]

[rules]
# Headings: sentence case.
"ai-tells-formatting.title-case-heading" = "warning"
# Semicolons are allowed; STE bans them.
"ste-punctuation.semicolon-used" = "off"
# Google does not ask for a vertical list for complex content.
"ste-sentences.complex-text-not-in-vertical-list" = "off"
# Say "for example", not "e.g." (the one Latin-abbreviation checker).
"ste-practices.latin-abbreviation" = "warning"
# Inclusive terms such as allowlist and blocklist (the one terminology checker).
"prose-inclusive.exclusive" = "warning"
"prose-inclusive.ableist" = "warning"
