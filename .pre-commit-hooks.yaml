- id: slopvac
  name: slopvac prose gate
  description: >-
    Lint staged prose with Slopvac for AI writing patterns, prose quality,
    documentation discipline, and technical-writing constraints.
  # `language: system` runs the `slopvac` binary already on PATH. Install it with
  # Homebrew, the shell installer, or `uv tool install slopvac`; see docs/hooks.md.
  entry: slopvac lint
  language: system
  types_or: [markdown, rst, plain-text, html]
  # pre-commit passes filenames positionally, which is what `lint` wants. It runs
  # only on staged files, so the gate sees the change rather than the repository.
  require_serial: false
