# GitHub's hosted runner images include ubuntu-26.04, but actionlint 1.7.7
# predates that label. Limit the compatibility exception to this workflow and
# only the stale runner-label diagnostic; all other actionlint checks still run.
paths:
  .github/workflows/cli-e2e.yml:
    ignore:
      - 'label "ubuntu-26\.04" is unknown'
  .github/workflows/test.yml:
    ignore:
      - 'label "macos-15-intel" is unknown'
  # Hosted runner labels newer than actionlint 1.7.7.
  .github/workflows/wheels.yml:
    ignore:
      - 'label "(macos-15-intel|ubuntu-24\.04-arm)" is unknown'
  .github/workflows/publish-pypi.yml:
    ignore:
      - 'label "(macos-15-intel|ubuntu-24\.04-arm)" is unknown'
  # Generated by cargo-dist (`dist generate`); hand edits would fail `dist generate --check`.
  # Ignore only its known shellcheck style notes.
  .github/workflows/release.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC(2086|2129|2001)'
  # Hosted runner labels newer than actionlint 1.7.7.
  .github/workflows/release-smoke.yml:
    ignore:
      - 'label "(macos-15-intel|ubuntu-24\.04-arm)" is unknown'
