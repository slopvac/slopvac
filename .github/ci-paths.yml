# Central path classification for CI.
#
# dorny/paths-filter consumes this file in the orchestrator. The final gate then
# verifies that every suite either ran or was skipped exactly as classified.
#
# Reusable workflow changes deliberately fan out to every class. The orchestrator
# also has a bootstrap force-all rule outside this file for changes to this file
# or to the orchestrator itself.

code:
  - '.github/workflows/**'
  - '.github/action-fixtures/**'
  - 'CLA.md'
  - 'pyproject.toml'
  - 'uv.lock'
  - 'packages/slopvac-lint/pyproject.toml'
  - 'packages/slopvac-lint/src/**'
  - 'packages/slopvac-lint/tests/**'
  - 'packages/slopvac-lint/tests/**'
  - 'packages/slopvac-lint/vale/styles-verified/**'
  - 'packages/slopvac-plugin/**'
  - 'tests/**'
  # The tests run the built slopvac binary, so a change to its sources reruns them.
  - 'action.yml'
  - 'crates/**'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'rust-toolchain.toml'
  - 'scripts/**/*.py'
  - 'scripts/install_vale.py'
  - 'mise.toml'
  - '**/conftest.py'
  - 'schemas/**'
  - 'docs/contract/**'
  - 'scripts/contract/**'
  - 'tests/contract/**'
  - 'crates/slopvac-text/**'
  - 'crates/slopvac-engine/tests/fixtures/**'
  - 'crates/slopvac-rules/tests/fixtures/**'
  - 'crates/slopvac-migrate/data/**'
  - 'crates/slopvac-migrate/tests/fixtures/**'
  - 'evals/**'
  - 'crates/slopvac-agents/data/model-evals.json'

# Rust workspace under crates/. Build, format, lint and test run across three
# operating systems.
rust:
  - '.github/workflows/**'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'crates/**'
  # Rust tests read the v3 schemas and their conformance corpus.
  - 'schemas/**'
  - 'rust-toolchain.toml'
  - 'rustfmt.toml'
  - '.github/cargo-delta.toml'
  - 'scripts/ci/rust_scope.py'
  - 'scripts/install_cargo_delta.sh'
  - 'scripts/install_release_archive.sh'
  - 'deny.toml'
  # Message-registry checks (ast-grep rules) and the append-only code lock.
  - 'ast-grep/**'
  - 'sgconfig.yml'
  - 'docs/reference/error-codes.lock'
  # Files outside crates/ that the crates embed with include_str!/include_bytes! or read
  # from their tests. tests/test_ci_routing.py derives the include_* paths from the
  # sources, so a new embedded input cannot escape this class.
  - '.cargo/**'
  - '.config/**'
  - 'clippy.toml'
  - 'about.toml'
  - 'keys/**'
  - 'docs/contract/compat/**'
  - 'docs/reference/cli.md'
  - 'docs/site.toml'
  - 'docs/model-recommendations.md'
  - 'docs/migrate-2-to-3.md'
  - 'packages/slopvac-lint/examples/blocklist.toml'
  - 'packages/slopvac-lint/src/slopvac/rules/**'
  - 'packages/slopvac-lint/tests/fixtures/regression/**'
  - 'packages/slopvac-plugin/**'
  - 'scripts/revocation_list.py'
  - 'tests/fixtures/workflow-escape-vectors.json'
  - 'tests/golden/**'
  - 'evals/corpus/**'
  - '.github/ISSUE_TEMPLATE/**'

diagram-adapter:
  - '.github/workflows/**'
  - 'crates/slopvac-diagrams/**'
  - 'crates/slopvac-engine/**'
  - 'evals/**'
  - 'tests/test_evals_diagrams.py'
  - 'tests/fixtures/diagram_eval_output.json'

# Reference-engine eval ratchet. Rule data, the Python engine, the eval corpus
# and the contracts the corpus is scored against.
evals:
  - '.github/workflows/**'
  - 'evals/**'
  - 'packages/slopvac-lint/src/**'
  - 'packages/slopvac-lint/vale/**'
  - 'scripts/install_vale.py'
  - 'schemas/**'
  - 'docs/contract/**'

# Docs site build (generated reference pages, Starlight, rustdoc, link check).
# Pull requests build only; the Pages deploy lives in docs-deploy.yml.
docs-site:
  - '.github/workflows/**'
  - 'site/**'
  - 'docs/site.toml'
  - 'docs/site-lint.toml'
  - 'scripts/docs/**'
  - 'tests/docs/**'
  - 'schemas/**'
  - 'packages/slopvac-lint/src/slopvac/rules/**'
  - 'crates/**'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'rust-toolchain.toml'
  - 'mise.toml'

package:
  - '.github/workflows/**'
  - 'pyproject.toml'
  - 'uv.lock'
  - 'packages/slopvac-lint/pyproject.toml'
  - 'packages/slopvac-lint/src/**'
  - 'packages/slopvac-lint/tests/**'
  - 'packages/slopvac-lint/vale/styles-verified/**'
  - 'scripts/install_vale.py'

# The composite action at the repository root, run with the binary built from
# this checkout.
action:
  - '.github/workflows/**'
  - '.github/action-fixtures/**'
  - 'action.yml'
  - 'slopvac.toml'
  - 'scripts/action_v3.py'
  - 'scripts/ci/install-rust-toolchain.sh'
  - 'crates/**'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'rust-toolchain.toml'

# The linter supports these prose extensions. Keep this list aligned with
# slopvac.contract.LINTABLE so repository prose cannot bypass its own gate.
docs:
  - '.github/workflows/**'
  - '.lychee.toml'
  - '.markdownlint-cli2.yaml'
  - '**/*.md'
  - '**/*.mdx'
  - '**/*.markdown'
  - '**/*.txt'
  - '**/*.rst'
  - '**/*.html'
  - 'slopvac.toml'
  - 'packages/slopvac-lint/src/slopvac/rules/**'

# Inputs to workflow/action/hook contract checks.
ci:
  - '.github/workflows/**'
  - '.github/actionlint.yaml'
  - '.agnix.toml'
  - '_typos.toml'
  - '.yamllint.yml'
  - '.pre-commit-config.yaml'
  - 'action.yml'
  - '.githooks/pre-commit'
  - 'scripts/check-agnix-staged.py'
  - 'scripts/install-agnix-hooks.py'
  - 'scripts/test-agnix-hook.py'

config:
  - '.github/workflows/**'
  - '.pre-commit-config.yaml'
  - '.yamllint.yml'
  - '.lychee.toml'
  - '.markdownlint-cli2.yaml'
  - '**/*.toml'

shell:
  - '.github/workflows/**'
  - '**/*.sh'

precommit:
  - '.github/workflows/**'
  - '.pre-commit-config.yaml'

complexity:
  - '.github/workflows/**'
  - 'packages/slopvac-lint/src/slopvac/cli.py'
  - 'packages/slopvac-lint/src/slopvac/score.py'

# Broad switch for the reusable lint workflow. Individual lint jobs use the more
# specific classifications above.
lint:
  - '.github/workflows/**'
  - '.github/actionlint.yaml'
  - '.github/action-fixtures/**'
  - '.agnix.toml'
  - '_typos.toml'
  - '.githooks/pre-commit'
  - '.pre-commit-config.yaml'
  - '.yamllint.yml'
  - '.lychee.toml'
  - '.markdownlint-cli2.yaml'
  - 'action.yml'
  - 'slopvac.toml'
  - 'pyproject.toml'
  - 'uv.lock'
  - 'packages/**'
  - 'tests/**'
  - 'scripts/**'
  - 'schemas/**'
  - 'docs/contract/**'
  - '**/*.md'
  - '**/*.mdx'
  - '**/*.markdown'
  - '**/*.txt'
  - '**/*.rst'
  - '**/*.html'
  - '**/*.toml'
  - '**/*.sh'

dependencies:
  - '.github/workflows/**'
  - 'pyproject.toml'
  - 'packages/slopvac-lint/pyproject.toml'
  - 'packages/slopvac-plugin/pyproject.toml'
  - 'uv.lock'

# Full filesystem vulnerability/misconfiguration scans are reserved for changes
# that can affect executable code, packaging, dependencies, or CI configuration.
filesystem:
  - '.github/workflows/**'
  - '.github/action-fixtures/**'
  - '.pre-commit-config.yaml'
  - '.yamllint.yml'
  - 'action.yml'
  - 'pyproject.toml'
  - 'uv.lock'
  - 'packages/slopvac-lint/pyproject.toml'
  - 'packages/slopvac-lint/src/**'
  - 'packages/slopvac-lint/tests/**'
  - 'packages/slopvac-plugin/**'
  - 'tests/**'
  - 'scripts/**'

# Secrets can exist in any tracked file, including extensionless and dot files.
# dorny/paths-filter uses picomatch with dot=true, so ** is genuinely all paths.
secrets:
  - '**'
