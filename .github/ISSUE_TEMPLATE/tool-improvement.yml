# Generated from crates/slopvac/src/report/fields.rs. Do not edit by hand.
# Regenerate with: SLOPVAC_UPDATE_FORMS=1 cargo test -p slopvac --test report_forms
name: "Tool improvement"
description: "Propose a change to the CLI, output, config, setup, or docs that is not about one rule."
title: "[tool improvement]: "
labels: ["tool-improvement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "An AI agent filing a report MUST disclose itself: tick Reported by an AI agent and fill in Agent, Model, and Harness and version. Reports must not contain paths or file names. Do not include user names, host names, repository names, organization names, or other private data. For security vulnerabilities, use the private vulnerability report on the Security tab."
  - type: checkboxes
    id: reporter
    attributes:
      label: "Reporter"
      options:
        - label: "Reported by an AI agent"
          required: false
  - type: input
    id: agent
    attributes:
      label: "Agent"
      description: "Agent product name, for example Claude Code, Codex, omp, Kiro, or Cursor. Write N/A when unknown."
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: "Model"
      description: "Record the active model name exactly as the harness reports it in its system prompt, context, or /model selection. Do not use self-description or config defaults. Write N/A when unavailable."
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: "Harness and version"
      description: "Use the harness's version command, for example claude --version, codex --version, or omp --version. Write N/A when unavailable."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "slopvac version"
      description: "Output of `slopvac --version`."
    validations:
      required: true
  - type: dropdown
    id: latest
    attributes:
      label: "Reproduces on the latest release"
      description: "Upgrade to the latest release and rerun your command. Installer install: `slopvac self update`. uv tool: `uv tool upgrade slopvac`. uvx: `uvx slopvac@latest`, because uvx reuses a cached environment. pip: `python -m pip install --upgrade slopvac`. uv pip: `uv pip install --upgrade slopvac`. Homebrew: `brew upgrade slopvac/tap/slopvac`. mise: `mise upgrade slopvac`. Any other install: download the latest release from https://github.com/slopvac/slopvac/releases. GitHub Action: change the version pin in your workflow. If the latest release fixes it, upgrade instead of filing."
      options:
        - "Yes"
        - "Not checked"
    validations:
      required: true
  - type: checkboxes
    id: duplicates
    attributes:
      label: "Duplicate search"
      options:
        - label: "I searched existing issues for duplicates"
          required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Output of `slopvac doctor --format json`. It shows a path only relative to the working directory, or as `<external>/<file name>`. Redact relative paths and external file names before you post it."
      render: "json"
    validations:
      required: false
  - type: textarea
    id: command
    attributes:
      label: "Command"
      description: "The exact command or commands you ran. Pipe the sample into `slopvac lint --stdin`. Do not include paths or file names."
      render: "shell"
  - type: textarea
    id: what-to-change
    attributes:
      label: "What to change"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: "Current behavior"
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: "Proposed behavior"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why this change helps"
    validations:
      required: true
