# Generated from crates/slopvac/src/report/fields.rs. Do not edit by hand.
# Regenerate with: SLOPVAC_UPDATE_FORMS=1 cargo test -p slopvac --test report_forms
name: "Correct match, wrong suggestion or fix"
description: "Report a correct finding with a wrong suggestion, fix, message, or guidance."
title: "[wrong fix]: "
labels: ["wrong-fix", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "An AI agent filing a report MUST disclose itself: tick Reported by an AI agent and fill in Agent, Model, and Harness and version. Reports must not contain paths or file names. Do not include user names, host names, repository names, organization names, or other private data. For security vulnerabilities, use the private vulnerability report on the Security tab."
  - type: checkboxes
    id: reporter
    attributes:
      label: "Reporter"
      options:
        - label: "Reported by an AI agent"
          required: false
  - type: input
    id: agent
    attributes:
      label: "Agent"
      description: "Agent product name, for example Claude Code, Codex, omp, Kiro, or Cursor. Write N/A when unknown."
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: "Model"
      description: "Record the active model name exactly as the harness reports it in its system prompt, context, or /model selection. Do not use self-description or config defaults. Write N/A when unavailable."
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: "Harness and version"
      description: "Use the harness's version command, for example claude --version, codex --version, or omp --version. Write N/A when unavailable."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "slopvac version"
      description: "Output of `slopvac --version`."
    validations:
      required: true
  - type: dropdown
    id: latest
    attributes:
      label: "Reproduces on the latest release"
      description: "Run `slopvac self update`. It upgrades an installer install and prints the upgrade command for any other install method. Rerun your command on the latest release. If the latest release fixes it, upgrade instead of filing."
      options:
        - "Yes"
        - "Not checked"
    validations:
      required: true
  - type: checkboxes
    id: duplicates
    attributes:
      label: "Duplicate search"
      options:
        - label: "I searched existing issues for duplicates"
          required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Output of `slopvac doctor --format json`. It shows a path only relative to the working directory, or as `<external>/<file name>`."
      render: "json"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: "Command"
      description: "The exact command or commands you ran. Pipe the sample into `slopvac lint --stdin`, or run `--fix` on a synthetic `sample.md`. Do not include other paths or file names."
      render: "shell"
    validations:
      required: true
  - type: input
    id: rule-id
    attributes:
      label: "Rule ID"
      description: "The qualified ID from the finding's `rule_id`, written `<plugin>:<category>.<rule>`. `slopvac rules` lists every ID."
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: "Genre and profile"
      description: "Genre: the `genre.id` value, and profile: the `profile` value, of the `<stdin>` entry in the output of `slopvac lint --stdin --format json`, run with the same `--config` and `--mode` flags as your command."
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: "Flagged text"
      description: "Paste the sample text itself. A local file path is not enough."
      render: "markdown"
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: "Finding"
      description: "A finding object from the `findings` list of the `<stdin>` entry in `slopvac lint --stdin --format json`."
      render: "json"
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: "What is wrong"
      multiple: true
      options:
        - "Wrong suggested replacement"
        - "--fix changed the meaning"
        - "--fix produced broken text"
        - "Misleading or unclear message"
        - "Fix guidance does not apply here"
    validations:
      required: true
  - type: textarea
    id: fixed-text
    attributes:
      label: "Text after the fix"
      description: "Text after `slopvac lint sample.md --fix`, run on a synthetic sample in an empty temporary directory."
      render: "markdown"
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: "Expected suggestion"
    validations:
      required: true
