name: CLA

# Trigger only. Nothing trusted runs here: a pull request can rewrite this file, so its result means
# nothing. The "CLA" check that the ruleset requires is a check run created by the CLA GitHub App
# from cla-check.yml, which GitHub runs from the default branch after this workflow finishes.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions: {}

jobs:
  trigger:
    name: CLA trigger
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo "CLA check requested; the CLA app posts the result."
