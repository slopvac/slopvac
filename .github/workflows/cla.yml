name: CLA
# Contributor License Agreement check, run by CLA Assistant Lite. Signatures live in
# slopvac/cla-signers and are written with a GitHub App token.
on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, closed, reopened, synchronize]
  merge_group:

permissions: {}

jobs:
  # Both jobs are named "CLA": that is the required status check name. A ruleset's
  # required checks also gate merge_group runs, so the merge queue needs a job with
  # the same name. The pull request run already enforced the CLA.
  CLA:
    name: CLA
    # Comments start the job only when they can matter: a pull request comment that
    # contains the sign phrase or `recheck`. The action itself accepts only a comment
    # whose whole trimmed body is the phrase, so this looser `contains` filter can
    # never drop a valid signature. Other comments never join the concurrency queue,
    # so they cannot displace a pending sign or sync run.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      (contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') ||
      contains(github.event.changes.body.from, 'I have read the CLA Document and I hereby sign the CLA') ||
      contains(github.event.comment.body, 'recheck')))
    concurrency:
      # Pull request events and comment events queue separately, so no comment can
      # replace a pending pull request check.
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false # Never cancel a CLA check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read # signatures are written to slopvac/cla-signers with the App token
      pull-requests: write
      statuses: write
    # Write scopes on a pull_request_target job are safe only while nothing here
    # checks out or executes pull request content. Do not add a checkout or build step.
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CLA_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
          owner: slopvac
          repositories: cla-signers
          permission-contents: write

      - name: CLA Assistant
        if: steps.app-token.outcome == 'success'
        # The slopvac fork of iainmcgin/cla-github-action v3.2.0, hardened in fork PRs #1 to #6.
        uses: slopvac/cla-github-action@24f90b8e956ba16ae1b98ba0de48ba07739476af # master after #5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/slopvac/slopvac/blob/main/CLA.md
          cla-version: apache-icla-2.2-v1
          branch: main # must not be protected
          allowlist: dependabot[bot],sjorsr-release-bot[bot],github-actions[bot],renovate[bot]
          remote-organization-name: slopvac
          remote-repository-name: cla-signers
          lock-pullrequest-aftermerge: true
          require-opener-as-author: true

      # The action re-runs the pull request's CLA check only when that check failed.
      # An edited or deleted sign comment can invalidate a check that already passed,
      # so re-run the latest pull_request_target run for the current head as well.
      # That run checks the recorded signatures against the comments again.
      - name: Re-check the pull request after a sign comment changed
        # Runs even when the action failed: a withdrawn signature fails the action,
        # and that is exactly when the earlier passing run must be re-checked.
        if: >-
          !cancelled() &&
          github.event_name == 'issue_comment' &&
          (github.event.action == 'edited' || github.event.action == 'deleted')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          head=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          branch=$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq .headRefName)
          # Match the head SHA and branch: fork PR runs carry no pull_requests list.
          run=$(BRANCH="$branch" gh api "repos/$REPO/actions/workflows/cla.yml/runs?event=pull_request_target&head_sha=$head&per_page=20" \
            --jq '[.workflow_runs[] | select(.head_branch == env.BRANCH)][0].id // empty')
          if [ -n "$run" ]; then
            gh run rerun "$run" --repo "$REPO"
          else
            echo "No pull_request_target CLA run for $head"
          fi

  CLA-merge-queue:
    name: CLA
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - run: echo "CLA enforced on the pull request"
