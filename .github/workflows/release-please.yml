name: Release Please

# Maintains a release PR from Conventional Commits, updates CHANGELOG.md and every
# version-carrying file, and tags a release on merge.
#
# ONE VERSION, ONE TAG. Everything here releases in lockstep behind a plain
# `vX.Y.Z`, from a single root package in release-please-config.json.
#
# Version fan-out: release-please owns the lint package metadata and pre-commit
# hook revision declared as extra-files in release-please-config.json.
#
# TOKEN: the release PR is authored with a GitHub App token
# (RELEASE_APP_CLIENT_ID + RELEASE_APP_PRIVATE_KEY), not the default GITHUB_TOKEN.
# GitHub does not trigger workflows from GITHUB_TOKEN commits, so required PR checks
# would sit as no-ops and the release PR would stay blocked. There is no fallback to
# GITHUB_TOKEN: a failed mint fails the job, and GITHUB_TOKEN here only reads.
# App permissions required: Contents RW + Pull requests RW.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No `if`: a missing variable or key fails the mint, and the job, instead of
      # degrading to GITHUB_TOKEN.
      - name: Mint release-app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # `client-id`, not `app-id`: the action deprecated the latter. The two take
          # different values -- the client id is the `Iv2...` string, not the numeric
          # app id -- so the variable holds the client id to match its own name.
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
