name: Action 3.0 contract

# Builds the slopvac binary from this checkout once, runs the 3.0 composite
# action (action-v3/) with it against a sloppy document, and checks the reports
# it feeds to reviewdog, code scanning and the Code Climate artifact. test.yml
# calls it as the `action-v3` job, routed by the `action-v3` class in
# .github/ci-paths.yml, so a change to the renderers runs it too. The pytest
# suites that run the same binary are in test.yml's `Full test suite` job. A
# fork pull request cannot be simulated here: the event is whatever triggered
# the run. The pytest suites cover the fork path with the reporter choice and
# the fork-review artifact check.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SLOPVAC_BIN: ${{ github.workspace }}/target/debug/slopvac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the toolchain; the helper recovers from a partial install.
      - name: Install the pinned toolchain
        run: bash scripts/ci/install-rust-toolchain.sh

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the slopvac binary
        run: cargo build --locked -p slopvac

      - name: Run the action, blocking
        id: blocking
        continue-on-error: true
        uses: ./action-v3
        with:
          paths: .github/action-fixtures/slop-laden.md
          config: .github/action-fixtures/slopvac-v3.toml
          binary: ${{ env.SLOPVAC_BIN }}
          fail-on-findings: "true"
          reporter: annotations

      - name: Run the action, non-blocking
        id: non-blocking
        continue-on-error: true
        uses: ./action-v3
        with:
          paths: .github/action-fixtures/slop-laden.md
          config: .github/action-fixtures/slopvac-v3.toml
          binary: ${{ env.SLOPVAC_BIN }}
          fail-on-findings: "false"
          reporter: annotations
          rdjsonl-file: reports/non-blocking.rdjsonl
          sarif-file: reports/non-blocking.sarif
          codeclimate: "false"

      - name: Check the gate
        env:
          BLOCKING: ${{ steps.blocking.outcome }}
          NON_BLOCKING: ${{ steps.non-blocking.outcome }}
        run: |
          set -euo pipefail
          if [[ "$BLOCKING" != "failure" ]]; then
            echo "blocking run: expected failure, got $BLOCKING" >&2
            exit 1
          fi
          if [[ "$NON_BLOCKING" != "success" ]]; then
            echo "non-blocking run: expected success, got $NON_BLOCKING" >&2
            exit 1
          fi

      - name: Check the reports the consumers read
        env:
          FINDINGS: ${{ steps.blocking.outputs.findings }}
          PASSED: ${{ steps.blocking.outputs.passed }}
          RDJSONL: ${{ steps.blocking.outputs.rdjsonl }}
          SARIF: ${{ steps.blocking.outputs.sarif }}
          CODECLIMATE: ${{ steps.blocking.outputs.codeclimate }}
        run: |
          set -euo pipefail
          if [[ "$PASSED" != "false" || "$FINDINGS" -lt 1 ]]; then
            echo "bad outputs: findings=$FINDINGS passed=$PASSED" >&2
            exit 1
          fi
          # Every report holds the same number of findings as the JSON summary.
          [[ "$(wc -l < "$RDJSONL")" -eq "$FINDINGS" ]]
          [[ "$(jq '.runs[0].results | length' "$SARIF")" -eq "$FINDINGS" ]]
          [[ "$(jq 'length' "$CODECLIMATE")" -eq "$FINDINGS" ]]
          # reviewdog, installed by the action, parses the rdjsonl report.
          posted="$(reviewdog -f=rdjsonl -name=slopvac -reporter=local \
            -filter-mode=nofilter -fail-level=none < "$RDJSONL")"
          grep -q 'core:prose-promotion' <<< "$posted"

      - name: Check the non-blocking reports exist
        run: test -s reports/non-blocking.rdjsonl && test -s reports/non-blocking.sarif
