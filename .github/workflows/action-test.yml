name: Action contract

# Builds the slopvac binary from this checkout once, runs the composite action
# at the repository root with it against a sloppy document, and checks the
# reports it feeds to reviewdog, code scanning and the Code Climate artifact.
# test.yml calls it as the `action-contract` job, routed by the `action` class
# in .github/ci-paths.yml, so a change to the renderers runs it too. The pytest
# suites that run the same binary are in test.yml's `Full test suite` job. A
# fork pull request cannot be simulated here: the event is whatever triggered
# the run. The pytest suites cover the fork path with the reporter choice and
# the fork-review artifact check.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SLOPVAC_BIN: ${{ github.workspace }}/target/debug/slopvac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the changed-files case needs the pull request base

      # rust-toolchain.toml pins the toolchain; the helper recovers from a partial install.
      - name: Install the pinned toolchain
        run: bash scripts/ci/install-rust-toolchain.sh

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the slopvac binary
        run: cargo build --locked -p slopvac

      - name: Run the action, blocking
        id: blocking
        continue-on-error: true
        uses: ./
        with:
          paths: .github/action-fixtures/slop-laden.md
          config: .github/action-fixtures/slopvac-v3.toml
          binary: ${{ env.SLOPVAC_BIN }}
          fail-on-findings: "true"
          reporter: annotations

      - name: Run the action, non-blocking
        id: non-blocking
        continue-on-error: true
        uses: ./
        with:
          paths: .github/action-fixtures/slop-laden.md
          config: .github/action-fixtures/slopvac-v3.toml
          binary: ${{ env.SLOPVAC_BIN }}
          fail-on-findings: "false"
          reporter: annotations
          rdjsonl-file: reports/non-blocking.rdjsonl
          sarif-file: reports/non-blocking.sarif
          codeclimate: "false"

      - name: Check the gate
        env:
          BLOCKING: ${{ steps.blocking.outcome }}
          NON_BLOCKING: ${{ steps.non-blocking.outcome }}
        run: |
          set -euo pipefail
          if [[ "$BLOCKING" != "failure" ]]; then
            echo "blocking run: expected failure, got $BLOCKING" >&2
            exit 1
          fi
          if [[ "$NON_BLOCKING" != "success" ]]; then
            echo "non-blocking run: expected success, got $NON_BLOCKING" >&2
            exit 1
          fi

      - name: Check the reports the consumers read
        env:
          FINDINGS: ${{ steps.blocking.outputs.findings }}
          PASSED: ${{ steps.blocking.outputs.passed }}
          RDJSONL: ${{ steps.blocking.outputs.rdjsonl }}
          SARIF: ${{ steps.blocking.outputs.sarif }}
          CODECLIMATE: ${{ steps.blocking.outputs.codeclimate }}
        run: |
          set -euo pipefail
          if [[ "$PASSED" != "false" || "$FINDINGS" -lt 1 ]]; then
            echo "bad outputs: findings=$FINDINGS passed=$PASSED" >&2
            exit 1
          fi
          # Every report holds the same number of findings as the JSON summary.
          [[ "$(wc -l < "$RDJSONL")" -eq "$FINDINGS" ]]
          [[ "$(jq '.runs[0].results | length' "$SARIF")" -eq "$FINDINGS" ]]
          [[ "$(jq 'length' "$CODECLIMATE")" -eq "$FINDINGS" ]]
          # reviewdog, installed by the action, parses the rdjsonl report.
          posted="$(reviewdog -f=rdjsonl -name=slopvac -reporter=local \
            -filter-mode=nofilter -fail-level=none < "$RDJSONL")"
          grep -q 'core:prose-promotion' <<< "$posted"

      - name: Check the non-blocking reports exist
        run: test -s reports/non-blocking.rdjsonl && test -s reports/non-blocking.sarif

      - name: Run the action on no target paths
        id: empty
        continue-on-error: true
        uses: ./
        with:
          paths: ""
          binary: ${{ env.SLOPVAC_BIN }}
          fail-on-findings: "true"
          reporter: none
          sarif: "false"
          codeclimate: "false"

      - name: Check an empty target list passes cleanly
        env:
          OUTCOME: ${{ steps.empty.outcome }}
          PASSED: ${{ steps.empty.outputs.passed }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "success" || "$PASSED" != "true" ]]; then
            echo "expected an empty-target success with passed=true, got outcome=$OUTCOME passed=$PASSED" >&2
            exit 1
          fi

      - name: Run the action on the changed files
        if: github.event_name == 'pull_request'
        id: changed
        continue-on-error: true
        uses: ./
        with:
          changed-files-only: "true"
          config: .github/action-fixtures/slopvac-v3.toml
          binary: ${{ env.SLOPVAC_BIN }}
          fail-on-findings: "false"
          reporter: none
          sarif: "false"
          codeclimate: "false"

      - name: Check the action linted exactly the changed prose
        if: github.event_name == 'pull_request'
        env:
          OUTCOME: ${{ steps.changed.outcome }}
          REPORT: ${{ steps.changed.outputs.json }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "success" ]]; then
            echo "expected the changed-files run to succeed, got $OUTCOME" >&2
            exit 1
          fi
          # The contract: the action lints the files the binary lints when it is
          # handed this pull request's changed prose paths. A pull request with
          # no prose change has an empty list and no report.
          mapfile -d '' changed < <(git diff -z --name-only --diff-filter=d \
            "${BASE_SHA}...HEAD" -- '*.md' '*.mdx' '*.markdown' '*.txt' '*.rst' '*.html')
          if (( ${#changed[@]} == 0 )); then
            [[ -z "$REPORT" || ! -e "$REPORT" ]] || { echo "unexpected report $REPORT" >&2; exit 1; }
            echo "no prose changed in this pull request; no report expected"
            exit 0
          fi
          reference="$RUNNER_TEMP/reference.json"
          # Exit 1 (findings) and 2 (incomplete) still write the report.
          "$SLOPVAC_BIN" --offline lint --config .github/action-fixtures/slopvac-v3.toml \
            --format json --out "$reference" -- "${changed[@]}" || true
          expected="$(jq -c '[.documents[].path] | sort' "$reference")"
          observed="$(jq -c '[.documents[].path] | sort' "$REPORT")"
          if [[ "$observed" != "$expected" ]]; then
            echo "expected the changed prose files $expected, got $observed" >&2
            exit 1
          fi
