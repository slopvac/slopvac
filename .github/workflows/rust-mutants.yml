name: Rust mutation testing

# Weekly cargo-mutants run. It reports surviving mutants (code the tests do not
# pin down) and never gates a pull request or the Tests job (slopvac-8l4.14.12).

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      package:
        description: "Limit the run to one workspace package (empty runs all)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: rust-mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    name: cargo-mutants
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # A surviving mutant is a finding, not a failure; so is a timeout.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: bash scripts/ci/install-rust-toolchain.sh

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mutants

      - name: Install cargo-mutants and cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-mutants@27.1.0,nextest@0.9.152

      - name: Run cargo-mutants
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          args=(--locked --no-shuffle --jobs 2)
          if [ -n "$PACKAGE" ]; then
            args+=(--package "$PACKAGE")
          fi
          cargo mutants "${args[@]}"

      - name: Summarise
        if: always()
        run: |
          {
            echo "## cargo-mutants"
            echo
            for f in caught missed timeout unviable; do
              [ -f "mutants.out/$f.txt" ] && echo "- $f: $(wc -l < "mutants.out/$f.txt")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore
