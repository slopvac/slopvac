name: CI

# One always-triggered workflow owns pull-request CI. Individual jobs are skipped
# with job-level conditions so required checks never disappear because an entire
# workflow was path-filtered.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      package: ${{ steps.filter.outputs.package }}
      rust: ${{ steps.filter.outputs.rust }}
      evals: ${{ steps.filter.outputs.evals }}
      docs-site: ${{ steps.filter.outputs.docs-site }}
      action: ${{ steps.filter.outputs.action }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
      config: ${{ steps.filter.outputs.config }}
      shell: ${{ steps.filter.outputs.shell }}
      precommit: ${{ steps.filter.outputs.precommit }}
      complexity: ${{ steps.filter.outputs.complexity }}
      lint: ${{ steps.filter.outputs.lint }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      filesystem: ${{ steps.filter.outputs.filesystem }}
      secrets: ${{ steps.filter.outputs.secrets }}
      force_all: ${{ steps.bootstrap.outputs.force_all }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # This routing guard is intentionally outside .github/ci-paths.yml. A broken
      # edit to the central map therefore cannot make its own validation disappear.
      - name: Protect CI routing changes
        id: bootstrap
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            force_all:
              - '.github/ci-paths.yml'
              - '.github/workflows/test.yml'

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Report classification
        env:
          MATCHED: ${{ steps.filter.outputs.changes }}
          FORCE_ALL: ${{ steps.bootstrap.outputs.force_all }}
        run: |
          set -euo pipefail
          echo "Matched CI classes: $MATCHED"
          echo "Force all suites: $FORCE_ALL"
          {
            echo "## CI change classification"
            echo
            echo "\`$MATCHED\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deliberately small and always on. This catches basic Python regressions and
  # malformed hook manifests even for docs/config-only changes.
  quick-lint:
    name: Quick lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Ruff
        working-directory: packages/slopvac-lint
        run: uvx ruff@0.16.3 check .

      - name: Release-please crate entries
        run: python3 scripts/sync_release_please_crates.py --check

      - name: Validate hook JSON
        run: |
          set -euo pipefail
          files="$(git ls-files '*hooks.json' | sort -u)"
          test -n "$files" || { echo 'no manifests found to validate'; exit 1; }
          for f in $files; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done

      # These tests inspect repository-wide documentation, configuration, and the
      # public command surface. Keep them in the small always-on job so those
      # invariants cannot be bypassed without making every docs-only change pay for
      # the complete pytest suite.
      - name: Repository-wide invariants
        env:
          INVARIANTS: >-
            retired_integration_names_do_not_survive_in_live_sources or
            removed_agent_packaging_has_no_live_paths_or_install_commands or
            judgement_rules_are_inspectable_but_have_no_command_group
        run: |
          uv run --project packages/slopvac-lint --extra dev python -m pytest -q \
            packages/slopvac-lint/tests/test_steering.py -k "$INVARIANTS"

  # Rust workspace checks. Static checks run once on Linux; tests run on every
  # supported target because platform behaviour (paths, line endings, PCRE2
  # builds) differs. nextest does not run doctests, so they get their own step.
  rust-static:
    name: Rust static checks
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rustdoc
        run: cargo doc --workspace --no-deps --document-private-items --locked

  rust:
    name: Rust (${{ matrix.name }})
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: linux-x64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - name: linux-arm64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-15-intel
          - name: windows-x64
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add the musl target
        if: matrix.musl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add "$TARGET"
          echo "CARGO_BUILD_TARGET=$TARGET" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest@0.9.152

      # The RST adapter runs docutils. With SLOPVAC_RST_LIVE set, its live tests fail
      # instead of skipping when docutils is missing, and the recorded driver output in the
      # fixtures must equal what the pinned docutils writes now.
      - name: Install the pinned docutils for the RST tests
        if: matrix.name == 'linux-x64'
        run: |
          python3 -m venv "$RUNNER_TEMP/rst-venv"
          "$RUNNER_TEMP/rst-venv/bin/python" -m pip install --quiet --require-hashes \
            -r crates/slopvac-engine/tests/fixtures/rst/requirements-docutils.pip
          "$RUNNER_TEMP/rst-venv/bin/python" crates/slopvac-engine/tests/fixtures/rst/generate.py --check
          echo "$RUNNER_TEMP/rst-venv/bin" >> "$GITHUB_PATH"
          echo "SLOPVAC_RST_LIVE=1" >> "$GITHUB_ENV"

      # The managed-Python plugin tests build real uv environments. With SLOPVAC_PYENV_LIVE
      # set, they fail instead of skipping when uv is missing. Managed environments are
      # refused on Windows, so only linux-x64 runs them. The cache holds uv's downloaded
      # CPython builds, scoped to the ref by GitHub's standard cache rules.
      - name: Install uv for the managed-Python tests
        if: matrix.name == 'linux-x64'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-python: true
          cache-suffix: rust-pyenv
          ignore-nothing-to-cache: true

      - name: Require the managed-Python tests
        if: matrix.name == 'linux-x64'
        run: echo "SLOPVAC_PYENV_LIVE=1" >> "$GITHUB_ENV"

      - name: Test
        run: cargo nextest run --workspace --locked --profile ci --no-tests=pass

      - name: Doctests
        run: cargo test --workspace --doc --locked

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.name }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # The declared rust-version is a promise; build with exactly that toolchain.
  rust-msrv:
    name: Rust MSRV
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          v="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install the MSRV toolchain
        run: rustup toolchain install "$MSRV" --profile minimal
        env:
          MSRV: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv

      - name: Check
        run: cargo "+$MSRV" check --workspace --all-targets --locked
        env:
          MSRV: ${{ steps.msrv.outputs.version }}

  rust-supply-chain:
    name: Rust supply chain
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-supply-chain.yml
    permissions:
      contents: read

  # Full repository test discovery on the newest supported Python. The root
  # pytest configuration includes both package tests and any repository-level
  # tests, so new test directories cannot silently sit outside CI.
  test:
    name: Full test suite
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Vale
        run: python3 scripts/install_vale.py --prefix "$HOME/.local/bin"
      - name: Add Vale to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install minisign
        # The release signing tests run the real binary; the script checks its sha256.
        run: bash scripts/install_minisign.sh

      - name: Install ast-grep
        run: |
          set -euo pipefail
          python3 -m pip install --quiet ast-grep-cli==0.45.3
          ast-grep --version

      - name: Install package and test dependencies
        # docutils is pinned for the RST sample of the golden suite (tests/golden/v3).
        run: python3 -m pip install --quiet -e "./packages/slopvac-lint[dev]" "docutils==0.23"

      - name: Run every discovered pytest suite
        run: python3 -m pytest

  # Exercise the published package across every Python version claimed in
  # project metadata. This is intentionally separate from the full-suite job.
  lint-package:
    name: slopvac (py${{ matrix.python }})
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        working-directory: packages/slopvac-lint
        run: uv pip install --system -e ".[dev]"

      - name: Install Vale
        run: python3 scripts/install_vale.py --prefix "$HOME/.local/bin"
      - name: Add Vale to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: pytest
        working-directory: packages/slopvac-lint
        run: python3 -m pytest tests -q

      - name: Ruleset loads for every locale
        working-directory: packages/slopvac-lint
        run: |
          set -euo pipefail
          for locale in en-US en-GB und; do
            printf 'Checking %s\n' "$locale"
            slopvac rules --format json > /dev/null
            printf 'A robust tool.\n' > /tmp/probe.md
            set +e
            slopvac /tmp/probe.md --locale "$locale" > /dev/null
            status=$?
            set -e
            test "$status" -ne 2 || { echo "locale $locale broke the run"; exit 1; }
          done

      - name: The rules reference is current
        if: matrix.python == '3.13'
        working-directory: packages/slopvac-lint
        run: slopvac reference --write docs/rules.md --check

      - name: The README's own commands work
        working-directory: packages/slopvac-lint
        run: |
          set -euo pipefail
          slopvac --version
          slopvac rules --format json > /tmp/rules.json
          python3 - <<'PY'
          import json
          payload = json.load(open("/tmp/rules.json"))
          kinds = [rule["kind"] for rule in payload["rules"]]
          assert len(kinds) == 237
          assert kinds.count("judgement") == 68
          assert all(
              rule["judgement_question"]
              for rule in payload["rules"]
              if rule["kind"] == "judgement"
          )
          PY
          slopvac explain orwell.stale-figure > /dev/null
          slopvac explain ai-tells-structure.negative-inventory-remainder > /dev/null
          slopvac prime write > /dev/null
          slopvac prime review > /dev/null
          slopvac init --path /tmp/slopvac.toml --skip-agents
          slopvac /tmp/probe.md --config /tmp/slopvac.toml || test $? -eq 1

  cli-e2e:
    name: CLI contract
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.package == 'true' ||
      needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/cli-e2e.yml
    permissions:
      contents: read
    with:
      package: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.package == 'true' }}
      docs: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.docs == 'true' }}

  action-contract:
    name: Composite action contract
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.action == 'true'
    uses: ./.github/workflows/action-test.yml
    permissions:
      contents: read

  lint:
    name: Relevant lint suites
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.lint == 'true'
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      security-events: write
    with:
      code: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.code == 'true' }}
      docs: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.docs == 'true' }}
      ci: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.ci == 'true' }}
      config: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.config == 'true' }}
      shell: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.shell == 'true' }}
      precommit: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.precommit == 'true' }}
      complexity: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.complexity == 'true' }}
      action: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.action == 'true' }}

  markdown-audit:
    name: Markdown audit
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/markdown-audit.yml
    permissions:
      contents: read

  security:
    name: Relevant security suites
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.secrets == 'true' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.dependencies == 'true' ||
      needs.changes.outputs.filesystem == 'true'
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
    with:
      code: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.code == 'true' }}
      dependencies: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.dependencies == 'true' }}
      filesystem: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.filesystem == 'true' }}
      secrets: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.secrets == 'true' }}

  evals-ratchet:
    name: Eval ratchet
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.evals == 'true'
    uses: ./.github/workflows/evals-ratchet.yml
    permissions:
      contents: read

  docs-site:
    name: Docs site build
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs['docs-site'] == 'true'
    uses: ./.github/workflows/docs-site.yml
    permissions:
      contents: read

  # Keep the established required-check name, but make it the single source of
  # truth for the whole CI graph. It enforces exact skip semantics: a suite must
  # succeed when its path class matched and must be skipped when it did not.
  gate:
    name: Tests gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - quick-lint
      - test
      - rust-static
      - rust
      - rust-msrv
      - rust-supply-chain
      - lint-package
      - cli-e2e
      - action-contract
      - lint
      - markdown-audit
      - security
      - evals-ratchet
      - docs-site
    if: always()
    steps:
      - name: Verify required runs and valid skips
        env:
          RESULTS: ${{ toJSON(needs) }}
          FORCE_ALL: ${{ needs.changes.outputs.force_all }}
          CODE: ${{ needs.changes.outputs.code }}
          PACKAGE: ${{ needs.changes.outputs.package }}
          RUST: ${{ needs.changes.outputs.rust }}
          ACTION: ${{ needs.changes.outputs.action }}
          LINT: ${{ needs.changes.outputs.lint }}
          DOCS: ${{ needs.changes.outputs.docs }}
          SECRETS: ${{ needs.changes.outputs.secrets }}
          DEPENDENCIES: ${{ needs.changes.outputs.dependencies }}
          FILESYSTEM: ${{ needs.changes.outputs.filesystem }}
          EVALS: ${{ needs.changes.outputs.evals }}
          DOCS_SITE: ${{ needs.changes.outputs['docs-site'] }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["RESULTS"])
          problems = []

          if needs["changes"]["result"] != "success":
              problems.append(
                  f"change classification was {needs['changes']['result']}, expected success"
              )

          force_all = os.environ["FORCE_ALL"] == "true"
          code = os.environ["CODE"] == "true"
          package = os.environ["PACKAGE"] == "true"
          rust = os.environ["RUST"] == "true"
          action = os.environ["ACTION"] == "true"
          lint = os.environ["LINT"] == "true"
          docs = os.environ["DOCS"] == "true"
          secrets = os.environ["SECRETS"] == "true"
          dependencies = os.environ["DEPENDENCIES"] == "true"
          filesystem = os.environ["FILESYSTEM"] == "true"
          evals = os.environ["EVALS"] == "true"
          docs_site = os.environ["DOCS_SITE"] == "true"

          expected = {
              "quick-lint": True,
              "test": force_all or code,
              "rust-static": force_all or rust,
              "rust": force_all or rust,
              "rust-msrv": force_all or rust,
              "rust-supply-chain": force_all or rust,
              "lint-package": force_all or package,
              "cli-e2e": force_all or package or docs,
              "action-contract": force_all or action,
              "lint": force_all or lint,
              "markdown-audit": force_all or docs,
              "security": force_all or secrets or code or dependencies or filesystem,
              "evals-ratchet": force_all or evals,
              "docs-site": force_all or docs_site,
          }

          for name, should_run in expected.items():
              actual = needs[name]["result"]
              wanted = "success" if should_run else "skipped"
              if actual != wanted:
                  problems.append(f"{name}: got {actual}, expected {wanted}")
              else:
                  print(f"{name}: {actual} (expected)")

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)

          print("all CI suites ran or skipped exactly as classified")
          PY

  # Compatibility shims for repositories that still require the old lint/security
  # gate names. They contain no independent policy; Tests gate is authoritative.
  lint-gate-compat:
    name: gate
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Mirror central gate
        env:
          RESULT: ${{ needs.gate.result }}
        run: test "$RESULT" = "success"

  security-gate-compat:
    name: security-gate
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Mirror central gate
        env:
          RESULT: ${{ needs.gate.result }}
        run: test "$RESULT" = "success"
