name: CI

# One always-triggered workflow owns pull-request CI. Individual jobs are skipped
# with job-level conditions so required checks never disappear because an entire
# workflow was path-filtered.
# Pushes to main run only what warms the caches that pull requests and the merge
# queue restore (rust-cache and the docs-site build save on main only) and the
# security scan of pushed commits. The commit already passed the full suite in its
# merge-group run, so every other job and the gates skip on push.
on:
  # Draft pull requests do no work: the root jobs below skip, and the gate fails
  # so no required check turns green. Marking the PR ready starts the real run.
  # Converting a PR to a draft starts a draft run, which cancels the ready run in
  # the same concurrency group.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  # The merge queue builds each entry on gh-readonly-queue/main/pr-N-<sha>. The
  # event carries no pull_request payload; the diff base is
  # github.event.merge_group.base_sha, which dorny/paths-filter reads natively.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

# Pull requests key on their number, and a newer push cancels the older run.
# Pushes to main key on the commit and queue entries on their ref, which embeds
# the PR number and head SHA. Those runs therefore never share a group, and they
# are never cancelled: a shared group would still drop a pending run.
concurrency:
  group: >-
    ci-${{ github.event.pull_request.number ||
    (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
      package: ${{ steps.filter.outputs.package }}
      rust: ${{ steps.filter.outputs.rust }}
      evals: ${{ steps.filter.outputs.evals }}
      diagram-adapter: ${{ steps.filter.outputs.diagram-adapter }}
      docs-site: ${{ steps.filter.outputs.docs-site }}
      action: ${{ steps.filter.outputs.action }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
      config: ${{ steps.filter.outputs.config }}
      shell: ${{ steps.filter.outputs.shell }}
      precommit: ${{ steps.filter.outputs.precommit }}
      complexity: ${{ steps.filter.outputs.complexity }}
      lint: ${{ steps.filter.outputs.lint }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      filesystem: ${{ steps.filter.outputs.filesystem }}
      secrets: ${{ steps.filter.outputs.secrets }}
      force_all: ${{ steps.force.outputs.force_all }}
      # How far the Rust jobs reach. `all` or `scoped`, and the cargo arguments for the
      # lint tier (fmt, clippy) and the build tier (build, test): `--workspace` or `-p NAME ...`.
      rust_scope: ${{ steps.scope.outputs.rust_scope }}
      rust_modified: ${{ steps.scope.outputs.rust_modified }}
      rust_affected: ${{ steps.scope.outputs.rust_affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # cargo-delta runs cargo metadata, so the job needs the pinned toolchain.
      - name: Install the pinned toolchain
        run: bash scripts/ci/install-rust-toolchain.sh

      # This routing guard is intentionally outside .github/ci-paths.yml. A broken
      # edit to the central map therefore cannot make its own validation disappear.
      - name: Protect CI routing changes
        id: bootstrap
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            force_all:
              - '.github/ci-paths.yml'
              - '.github/workflows/test.yml'

      # The merge queue and pushes to main are the authoritative backstop, so they
      # run every suite whatever the diff touched. Only pull requests route by diff.
      - name: Run every suite on the queue and main
        id: force
        env:
          EVENT_NAME: ${{ github.event_name }}
          ROUTING_CHANGED: ${{ steps.bootstrap.outputs.force_all }}
        run: |
          set -euo pipefail
          force_all=false
          if [ "$ROUTING_CHANGED" = "true" ] || [ "$EVENT_NAME" = "merge_group" ] || [ "$EVENT_NAME" = "push" ]; then
            force_all=true
          fi
          echo "force_all=$force_all" >> "$GITHUB_OUTPUT"

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci-paths.yml

      # Pull requests that touch Rust check only the changed crates and their dependents.
      # cargo-delta needs the full history (above) and the pinned toolchain for cargo
      # metadata. The queue and main skip these steps and run the whole workspace.
      - name: Install cargo-delta
        if: steps.force.outputs.force_all != 'true' && steps.filter.outputs.rust == 'true'
        run: bash scripts/install_cargo_delta.sh

      # Fails closed: any error, timeout or empty answer from cargo-delta, and any path
      # that .github/cargo-delta.toml lists as a trip wire, selects the whole workspace.
      - name: Scope the Rust jobs
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # Anything but `false` selects the whole workspace, including a Rust-free run.
          FORCE_ALL: ${{ steps.force.outputs.force_all == 'true' || steps.filter.outputs.rust != 'true' }}
        run: python3 scripts/ci/rust_scope.py

      - name: Report classification
        env:
          MATCHED: ${{ steps.filter.outputs.changes }}
          FORCE_ALL: ${{ steps.force.outputs.force_all }}
        run: |
          set -euo pipefail
          echo "Matched CI classes: $MATCHED"
          echo "Force all suites: $FORCE_ALL"
          {
            echo "## CI change classification"
            echo
            echo "\`$MATCHED\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deliberately small and always on. This catches basic Python regressions and
  # malformed hook manifests even for docs/config-only changes.
  quick-lint:
    name: Quick lint
    if: github.event_name != 'push' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Ruff
        working-directory: packages/slopvac-lint
        run: uvx ruff@0.16.3 check .

      - name: Release-please crate entries
        run: python3 scripts/sync_release_please_crates.py --check

      - name: Validate hook JSON
        run: |
          set -euo pipefail
          files="$(git ls-files '*hooks.json' | sort -u)"
          test -n "$files" || { echo 'no manifests found to validate'; exit 1; }
          for f in $files; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done

      - name: Rust pins agree
        run: python3 scripts/ci/check_rust_pins.py

      # These tests inspect repository-wide documentation, configuration, and the
      # public command surface. Keep them in the small always-on job so those
      # invariants cannot be bypassed without making every docs-only change pay for
      # the complete pytest suite.
      - name: Repository-wide invariants
        env:
          INVARIANTS: >-
            retired_integration_names_do_not_survive_in_live_sources or
            removed_agent_packaging_has_no_live_paths_or_install_commands or
            judgement_rules_are_inspectable_but_have_no_command_group
        run: |
          uv run --project packages/slopvac-lint --extra dev python -m pytest -q \
            packages/slopvac-lint/tests/test_steering.py -k "$INVARIANTS"

  # Rust workspace checks. Static checks run once on Linux; tests run on every
  # supported target because platform behaviour (paths, line endings, PCRE2
  # builds) differs. nextest does not run doctests, so they get their own step.
  rust-static:
    name: Rust static checks
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
      RUST_MODIFIED: ${{ needs.changes.outputs.rust_modified }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the toolchain; the helper recovers from a partial install.
      - name: Install the pinned toolchain
        run: bash scripts/ci/install-rust-toolchain.sh

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # RUST_MODIFIED is `--workspace` or a list of `-p NAME` pairs that rust_scope.py checked
      # against a plain-name pattern, so the unquoted word splitting below is intended.
      - name: Check formatting
        run: |
          set -euo pipefail
          if [ "$RUST_MODIFIED" = "--workspace" ]; then
            cargo fmt --all --check
          else
            # shellcheck disable=SC2086
            cargo fmt $RUST_MODIFIED --check
          fi

      - name: Clippy
        run: |
          # shellcheck disable=SC2086
          cargo clippy $RUST_MODIFIED --all-targets --all-features --locked -- -D warnings

      - name: Generated schemas
        run: cargo run -p slopvac-schemas --locked -- check

      - name: Rustdoc
        run: cargo doc --workspace --no-deps --document-private-items --locked

      # mise reads the ast-grep pin from mise.toml and verifies the download through its aqua
      # backend. Only ast-grep's bin directory joins PATH, added below: no shims, no mise.toml
      # [env] and no cache write.
      - name: Install ast-grep
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: ast-grep
          cache: false
          env: false
          add_shims_to_path: false
      # With `env: false` the action exports only the mise binary directory. Link just the
      # ast-grep binary into its own directory, because the install directory also holds `sg`,
      # which would shadow the system `sg`.
      - name: Put ast-grep on PATH
        run: |
          set -eu
          dirs="$(mise bin-paths ast-grep)"
          if [ "$(printf '%s\n' "$dirs" | wc -l)" -ne 1 ] || [ ! -x "$dirs/ast-grep" ]; then
            echo "expected one ast-grep install directory, got: $dirs" >&2
            exit 1
          fi
          bin="$RUNNER_TEMP/ast-grep-bin"
          mkdir -p "$bin"
          ln -s "$dirs/ast-grep" "$bin/ast-grep"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Message registry checks
        run: |
          ast-grep test
          ast-grep scan

      # The fuzz crate is outside the workspace (cargo-fuzz needs nightly), so build it
      # here to keep the target compiling.
      - name: Check the fuzz targets
        run: cargo check --manifest-path crates/slopvac-comments/fuzz/Cargo.toml --locked

  rust:
    name: Rust (${{ matrix.name }})
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUST_AFFECTED: ${{ needs.changes.outputs.rust_affected }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test linux-x64 only. Pushes to main run every leg, so a
        # platform break cannot go unseen. The merge queue runs every leg except
        # macos-arm64: GitHub often cannot acquire a hosted arm64 macOS runner, which
        # ejects the merge group. See bead slopvac-8l4.14.36; revisit once arm64
        # not-acquired cancellations on main are zero for 7 days. Each event gets a
        # complete list: GitHub turns an `include` entry that matches no
        # combination into a new one, so legs cannot be filtered out of one list.
        # Native Windows CI returns with 3.x epic slopvac-8l4.18.8 (3.0 supports Windows via WSL).
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"name": "linux-x64", "os": "ubuntu-latest"}]'
          || github.event_name == 'merge_group'
          && '[{"name": "linux-x64", "os": "ubuntu-latest"},
          {"name": "linux-arm64", "os": "ubuntu-24.04-arm"},
          {"name": "linux-x64-musl", "os": "ubuntu-latest",
          "target": "x86_64-unknown-linux-musl", "musl": true},
          {"name": "linux-arm64-musl", "os": "ubuntu-24.04-arm",
          "target": "aarch64-unknown-linux-musl", "musl": true},
          {"name": "macos-x64", "os": "macos-15-intel"}]'
          || '[{"name": "linux-x64", "os": "ubuntu-latest"},
          {"name": "linux-arm64", "os": "ubuntu-24.04-arm"},
          {"name": "linux-x64-musl", "os": "ubuntu-latest",
          "target": "x86_64-unknown-linux-musl", "musl": true},
          {"name": "linux-arm64-musl", "os": "ubuntu-24.04-arm",
          "target": "aarch64-unknown-linux-musl", "musl": true},
          {"name": "macos-arm64", "os": "macos-latest"},
          {"name": "macos-x64", "os": "macos-15-intel"}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the toolchain; the helper recovers from a partial install.
      - name: Install the pinned toolchain
        run: bash scripts/ci/install-rust-toolchain.sh

      - name: Add the musl target
        if: matrix.musl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add "$TARGET"
          echo "CARGO_BUILD_TARGET=$TARGET" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: nextest@0.9.152

      # The RST adapter runs docutils. With SLOPVAC_RST_LIVE set, its live tests fail
      # instead of skipping when docutils is missing, and the recorded driver output in the
      # fixtures must equal what the pinned docutils writes now.
      - name: Install the pinned docutils for the RST tests
        if: matrix.name == 'linux-x64'
        run: |
          python3 -m venv "$RUNNER_TEMP/rst-venv"
          "$RUNNER_TEMP/rst-venv/bin/python" -m pip install --quiet --require-hashes \
            -r crates/slopvac-engine/tests/fixtures/rst/requirements-docutils.pip
          "$RUNNER_TEMP/rst-venv/bin/python" crates/slopvac-engine/tests/fixtures/rst/generate.py --check
          echo "$RUNNER_TEMP/rst-venv/bin" >> "$GITHUB_PATH"
          echo "SLOPVAC_RST_LIVE=1" >> "$GITHUB_ENV"

      # The managed-Python plugin tests build real uv environments. With SLOPVAC_PYENV_LIVE
      # set, they fail instead of skipping when uv is missing. Managed environments are
      # needs the Linux toolchain, so only linux-x64 runs them. The cache holds uv's downloaded
      # CPython builds, scoped to the ref by GitHub's standard cache rules.
      - name: Install uv for the managed-Python tests
        if: matrix.name == 'linux-x64'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-python: true
          cache-suffix: rust-pyenv
          ignore-nothing-to-cache: true

      - name: Require the managed-Python tests
        if: matrix.name == 'linux-x64'
        run: echo "SLOPVAC_PYENV_LIVE=1" >> "$GITHUB_ENV"

      # The N1 network-sandbox test (crates/slopvac/tests/network_sandbox.rs) runs the
      # offline commands under an unprivileged user and network namespace. Ubuntu 24.04
      # runners restrict unprivileged user namespaces through AppArmor, so the test could
      # not build its sandbox and would fail in CI. Lift the restriction for this job only,
      # and prove a namespace can be created before the tests run.
      - name: Allow unprivileged user namespaces for the network-sandbox test
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --net true

      # RUST_AFFECTED is `--workspace` or a checked list of `-p NAME` pairs; see rust-static.
      # A push to main builds the test binaries to warm this leg's cache and to catch a
      # platform build break, but does not run them: the merge-group run already did.
      # macos-arm64 is the exception: only the push matrix has that leg (the queue cannot
      # always get a hosted arm64 macOS runner), so no earlier run tested Apple Silicon.
      - name: Build the tests
        if: github.event_name == 'push' && matrix.name != 'macos-arm64'
        run: |
          # shellcheck disable=SC2086
          cargo nextest run $RUST_AFFECTED --locked --profile ci --no-run

      - name: Test
        if: github.event_name != 'push' || matrix.name == 'macos-arm64'
        run: |
          # shellcheck disable=SC2086
          cargo nextest run $RUST_AFFECTED --locked --profile ci --no-tests=pass

      - name: Doctests
        if: github.event_name != 'push' || matrix.name == 'macos-arm64'
        run: |
          # shellcheck disable=SC2086
          cargo test $RUST_AFFECTED --doc --locked

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.name }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # The declared rust-version is a promise; build with exactly that toolchain.
  rust-msrv:
    name: Rust MSRV
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: bash scripts/ci/install-rust-toolchain.sh

      - name: Read the declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          v="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install the MSRV toolchain
        run: rustup toolchain install "$MSRV" --profile minimal
        env:
          MSRV: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        # RUST_AFFECTED is `--workspace` or a checked list of `-p NAME` pairs; see rust-static.
        run: |
          # shellcheck disable=SC2086
          cargo "+$MSRV" check $RUST_AFFECTED --all-targets --locked
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
          RUST_AFFECTED: ${{ needs.changes.outputs.rust_affected }}

  rust-supply-chain:
    name: Rust supply chain
    needs: changes
    if: >-
      github.event_name != 'push' &&
      (
        needs.changes.outputs.force_all == 'true' ||
        needs.changes.outputs.rust == 'true'
      )
    uses: ./.github/workflows/rust-supply-chain.yml
    permissions:
      contents: read

  # Full repository test discovery on the newest supported Python. The root
  # pytest configuration includes both package tests and any repository-level
  # tests, so new test directories cannot silently sit outside CI.
  test:
    name: Full test suite
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Action and fork-review tests run this binary. They fail in CI when it is missing.
      SLOPVAC_BIN: ${{ github.workspace }}/target/debug/slopvac
      SLOPVAC_REQUIRE_BIN: "1"
      # tests/test_rust_scope.py runs the pinned cargo-delta on a throwaway workspace.
      SLOPVAC_REQUIRE_CARGO_DELTA: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: bash scripts/ci/install-rust-toolchain.sh

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: pytest
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A push to main only saves the `pytest` cache for pull requests to restore. The
      # merge-group run already ran the suite on this tree, so the steps below skip.
      - name: Build the slopvac binary
        run: cargo build --locked -p slopvac

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Cache Vale download
        if: github.event_name != 'push'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vale-cache
          key: vale-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install_vale.py') }}
      - name: Install Vale
        if: github.event_name != 'push'
        run: python3 scripts/install_vale.py --prefix "$HOME/.local/bin" --cache-dir "$RUNNER_TEMP/vale-cache"
      - name: Add Vale to PATH
        if: github.event_name != 'push'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install cargo-delta
        if: github.event_name != 'push'
        run: bash scripts/install_cargo_delta.sh

      - name: Install minisign
        if: github.event_name != 'push'
        # The release signing tests run the real binary; the script checks its sha256.
        run: bash scripts/install_minisign.sh

      - name: Install package and test dependencies
        if: github.event_name != 'push'
        # docutils is pinned for the RST sample of the golden suite (tests/golden/v3).
        run: python3 -m pip install --quiet -e "./packages/slopvac-lint[dev]" "docutils==0.23"

      - name: Install the hook runners
        if: github.event_name != 'push'
        # tests/test_pre_commit_hooks.py runs the published hook through both.
        run: python3 -m pip install --quiet pre-commit==4.7.0 prek==0.5.11

      - name: Run every discovered pytest suite
        if: github.event_name != 'push'
        run: python3 -m pytest

      # Needs history for the baseline, so this step alone fetches in full. A pull
      # request compares with its merge-base; a merge-queue entry compares with the
      # base commit the queue built it on.
      - name: Schema additive-only check
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = merge_group ]; then
            git fetch --no-tags --unshallow origin || git fetch --no-tags origin
            base="$QUEUE_BASE_SHA"
          else
            git fetch --no-tags --unshallow origin "$BASE_REF" \
              || git fetch --no-tags origin "$BASE_REF"
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          fi
          git cat-file -e "$base^{commit}"
          python3 scripts/contract/schema_compat.py --base "$base"

  diagram-adapter:
    name: Live diagram adapter
    needs: changes
    if: >-
      github.event_name != 'push' &&
      (
        needs.changes.outputs.force_all == 'true' ||
        needs.changes.outputs['diagram-adapter'] == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: bash scripts/ci/install-rust-toolchain.sh

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Run the live diagram adapter test
        run: >-
          uv run --locked --extra dev pytest -q tests/test_evals_diagrams.py
          -k test_live_adapter_reproduces_the_recorded_output
        env:
          SLOPVAC_EVALS_LIVE_ENGINE: "1"

  # Exercise the published package across every Python version claimed in
  # project metadata. This is intentionally separate from the full-suite job.
  lint-package:
    name: slopvac (py${{ matrix.python }})
    needs: changes
    if: >-
      github.event_name != 'push' &&
      (
        needs.changes.outputs.force_all == 'true' ||
        needs.changes.outputs.package == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the oldest and newest supported Python; the merge
        # queue and pushes to main test every version.
        python: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '["3.11", "3.14"]'
          || '["3.11", "3.12", "3.13", "3.14"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: bash scripts/ci/install-rust-toolchain.sh

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        working-directory: packages/slopvac-lint
        run: uv pip install --system -e ".[dev]"

      - name: Cache Vale download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vale-cache
          key: vale-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install_vale.py') }}
      - name: Install Vale
        run: python3 scripts/install_vale.py --prefix "$HOME/.local/bin" --cache-dir "$RUNNER_TEMP/vale-cache"
      - name: Add Vale to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: pytest
        working-directory: packages/slopvac-lint
        run: python3 -m pytest tests -q

      # The 2.x CLI looks for slopvac.toml from the working directory upward, and the
      # repository's own slopvac.toml is a 3.x file that it rejects (exit 2). The three
      # steps below run from the runner's temp directory, so they never read it.
      - name: Ruleset loads for every locale
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for locale in en-US en-GB und; do
            printf 'Checking %s\n' "$locale"
            slopvac rules --format json > /dev/null
            printf 'A robust tool.\n' > /tmp/probe.md
            set +e
            slopvac /tmp/probe.md --locale "$locale" > /dev/null
            status=$?
            set -e
            test "$status" -ne 2 || { echo "locale $locale broke the run"; exit 1; }
          done

      - name: The rules reference is current
        if: matrix.python == '3.14'
        working-directory: ${{ runner.temp }}
        run: slopvac reference --write "$GITHUB_WORKSPACE/packages/slopvac-lint/docs/rules.md" --check

      - name: The README's own commands work
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          slopvac --version
          slopvac rules --format json > /tmp/rules.json
          python3 - <<'PY'
          import json
          payload = json.load(open("/tmp/rules.json"))
          kinds = [rule["kind"] for rule in payload["rules"]]
          ids = [f"{rule['category']}.{rule['id']}" for rule in payload["rules"]]
          assert len(ids) == len(set(ids)), "duplicate rule ids"
          assert kinds[ids.index("prose-scope.mixed-content-types")] == "judgement"
          assert all(
              rule["judgement_question"]
              for rule in payload["rules"]
              if rule["kind"] == "judgement"
          )
          PY
          slopvac explain orwell.stale-figure > /dev/null
          slopvac explain ai-tells-structure.negative-inventory-remainder > /dev/null
          slopvac prime write > /dev/null
          slopvac prime review > /dev/null
          slopvac init --path /tmp/slopvac.toml --skip-agents
          slopvac /tmp/probe.md --config /tmp/slopvac.toml || test $? -eq 1

  cli-e2e:
    name: CLI contract
    needs: changes
    if: >-
      github.event_name != 'push' &&
      (
        needs.changes.outputs.force_all == 'true' ||
        needs.changes.outputs.package == 'true' ||
        needs.changes.outputs.docs == 'true'
      )
    uses: ./.github/workflows/cli-e2e.yml
    permissions:
      contents: read
    with:
      package: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.package == 'true' }}
      docs: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.docs == 'true' }}

  action-contract:
    name: Composite action contract
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.action == 'true'
    uses: ./.github/workflows/action-test.yml
    permissions:
      contents: read

  lint:
    name: Relevant lint suites
    needs: changes
    if: >-
      github.event_name != 'push' &&
      (
        needs.changes.outputs.force_all == 'true' ||
        needs.changes.outputs.lint == 'true'
      )
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
    with:
      code: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.code == 'true' }}
      docs: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.docs == 'true' }}
      ci: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.ci == 'true' }}
      config: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.config == 'true' }}
      shell: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.shell == 'true' }}
      precommit: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.precommit == 'true' }}
      complexity: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.complexity == 'true' }}
      action: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.action == 'true' }}

  markdown-audit:
    name: Markdown audit
    needs: changes
    if: >-
      github.event_name != 'push' &&
      (
        needs.changes.outputs.force_all == 'true' ||
        needs.changes.outputs.docs == 'true'
      )
    uses: ./.github/workflows/markdown-audit.yml
    permissions:
      contents: read

  security:
    name: Relevant security suites
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.secrets == 'true' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.dependencies == 'true' ||
      needs.changes.outputs.filesystem == 'true'
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
    with:
      code: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.code == 'true' }}
      dependencies: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.dependencies == 'true' }}
      filesystem: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.filesystem == 'true' }}
      secrets: ${{ needs.changes.outputs.force_all == 'true' || needs.changes.outputs.secrets == 'true' }}

  evals-ratchet:
    name: Eval ratchet
    needs: changes
    if: >-
      github.event_name != 'push' &&
      (
        needs.changes.outputs.force_all == 'true' ||
        needs.changes.outputs.evals == 'true'
      )
    uses: ./.github/workflows/evals-ratchet.yml
    permissions:
      contents: read

  docs-site:
    name: Docs site build
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs['docs-site'] == 'true'
    uses: ./.github/workflows/docs-site.yml
    permissions:
      contents: read

  # Keep the established required-check name, but make it the single source of
  # truth for the whole CI graph. It enforces exact skip semantics: a suite must
  # succeed when its path class matched and must be skipped when it did not.
  gate:
    name: Tests gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - quick-lint
      - test
      - diagram-adapter
      - rust-static
      - rust
      - rust-msrv
      - rust-supply-chain
      - lint-package
      - cli-e2e
      - action-contract
      - lint
      - markdown-audit
      - security
      - evals-ratchet
      - docs-site
    if: always() && github.event_name != 'push'
    steps:
      - name: Verify required runs and valid skips
        env:
          RESULTS: ${{ toJSON(needs) }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
          FORCE_ALL: ${{ needs.changes.outputs.force_all }}
          EVENT_NAME: ${{ github.event_name }}
          RUST_SCOPE: ${{ needs.changes.outputs.rust_scope }}
          RUST_MODIFIED: ${{ needs.changes.outputs.rust_modified }}
          RUST_AFFECTED: ${{ needs.changes.outputs.rust_affected }}
          CODE: ${{ needs.changes.outputs.code }}
          PACKAGE: ${{ needs.changes.outputs.package }}
          RUST: ${{ needs.changes.outputs.rust }}
          ACTION: ${{ needs.changes.outputs.action }}
          LINT: ${{ needs.changes.outputs.lint }}
          DOCS: ${{ needs.changes.outputs.docs }}
          SECRETS: ${{ needs.changes.outputs.secrets }}
          DEPENDENCIES: ${{ needs.changes.outputs.dependencies }}
          FILESYSTEM: ${{ needs.changes.outputs.filesystem }}
          EVALS: ${{ needs.changes.outputs.evals }}
          DIAGRAM_ADAPTER: ${{ needs.changes.outputs['diagram-adapter'] }}
          DOCS_SITE: ${{ needs.changes.outputs['docs-site'] }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          # A skipped job reports success to branch protection, so a draft must
          # fail here rather than pass with nothing run.
          if os.environ["DRAFT"] == "true":
              print("::error::draft pull request: CI runs once it is marked ready for review")
              sys.exit(1)

          needs = json.loads(os.environ["RESULTS"])
          problems = []

          if needs["changes"]["result"] != "success":
              problems.append(
                  f"change classification was {needs['changes']['result']}, expected success"
              )

          force_all = os.environ["FORCE_ALL"] == "true"
          code = os.environ["CODE"] == "true"
          package = os.environ["PACKAGE"] == "true"
          rust = os.environ["RUST"] == "true"
          action = os.environ["ACTION"] == "true"
          lint = os.environ["LINT"] == "true"
          docs = os.environ["DOCS"] == "true"
          secrets = os.environ["SECRETS"] == "true"
          dependencies = os.environ["DEPENDENCIES"] == "true"
          filesystem = os.environ["FILESYSTEM"] == "true"
          evals = os.environ["EVALS"] == "true"
          diagram_adapter = os.environ["DIAGRAM_ADAPTER"] == "true"
          docs_site = os.environ["DOCS_SITE"] == "true"

          expected = {
              "quick-lint": True,
              "test": force_all or code,
              "diagram-adapter": force_all or diagram_adapter,
              "rust-static": force_all or rust,
              "rust": force_all or rust,
              "rust-msrv": force_all or rust,
              "rust-supply-chain": force_all or rust,
              "lint-package": force_all or package,
              "cli-e2e": force_all or package or docs,
              "action-contract": force_all or action,
              "lint": force_all or lint,
              "markdown-audit": force_all or docs,
              "security": force_all or secrets or code or dependencies or filesystem,
              "evals-ratchet": force_all or evals,
              "docs-site": force_all or docs_site,
          }

          # The Rust scope only narrows a pull request. The queue and main, and any run
          # whose routing was edited, must cover the whole workspace.
          scope = os.environ["RUST_SCOPE"]
          if rust or force_all:
              modified = os.environ["RUST_MODIFIED"]
              affected = os.environ["RUST_AFFECTED"]
              if scope not in ("all", "scoped"):
                  problems.append(f"rust scope was {scope!r}, expected all or scoped")
              elif scope == "all" and (modified != "--workspace" or affected != "--workspace"):
                  problems.append("rust scope is all but the cargo arguments are not --workspace")
              elif scope == "scoped" and (
                  force_all
                  or os.environ["EVENT_NAME"] != "pull_request"
                  or "--workspace" in (modified, affected)
                  or not modified.startswith("-p ")
                  or not affected.startswith("-p ")
              ):
                  problems.append("rust scope is scoped where the whole workspace must run")

          for name, should_run in expected.items():
              actual = needs[name]["result"]
              wanted = "success" if should_run else "skipped"
              if actual != wanted:
                  problems.append(f"{name}: got {actual}, expected {wanted}")
              else:
                  print(f"{name}: {actual} (expected)")

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)

          print("all CI suites ran or skipped exactly as classified")
          PY

  # Compatibility shims for repositories that still require the old lint/security
  # gate names. They contain no independent policy; Tests gate is authoritative.
  lint-gate-compat:
    name: gate
    needs: gate
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Mirror central gate
        env:
          RESULT: ${{ needs.gate.result }}
        run: test "$RESULT" = "success"

  security-gate-compat:
    name: security-gate
    needs: gate
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Mirror central gate
        env:
          RESULT: ${{ needs.gate.result }}
        run: test "$RESULT" = "success"
