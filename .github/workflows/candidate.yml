name: Release candidate

# Cuts a slopvac release candidate from an `rc/vX.Y.Z-rc.N` tag (bead slopvac-8l4.13.4).
#
# Pushing the tag runs the offline accuracy gate and the migration end-to-end
# tests, builds the wheels, and publishes `X.Y.ZrcN` to PyPI after approval in
# the `pypi` environment. `workflow_dispatch` is a dry run by default: it builds
# and tests the branch you pick and never publishes unless dry-run is false and
# the ref is a candidate tag.
#
# A stable `vX.Y.Z` release must descend from a passed run of this workflow
# (see release-provenance.yml and scripts/release_provenance.py).
#
# PyPI Trusted Publishing is bound to this file name and the `pypi` environment.
# A maintainer registers `candidate.yml` as a trusted publisher before the first
# candidate; nothing here changes PyPI or repository settings.

on:
  push:
    tags:
      - "rc/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Candidate tag the version comes from, for example rc/v3.0.0-rc.1"
        required: true
        type: string
      dry-run:
        description: "Build and test only; never publish"
        required: true
        type: boolean
        default: true

# Every job declares its own permissions; the default grants none.
permissions: {}

concurrency:
  group: candidate-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the candidate tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      cargo-version: ${{ steps.parse.outputs.cargo }}
      pypi-version: ${{ steps.parse.outputs.pypi }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Parse the tag
        id: parse
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release_provenance.py parse-tag "$TAG" >> "$GITHUB_OUTPUT"

      - name: Decide whether this run may publish
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry-run }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "$EVENT" == "push" ]]; then
            publish=true
          elif [[ "$DRY_RUN" == "false" ]]; then
            # A real dispatch run must be started on the candidate tag itself.
            if [[ "$REF_TYPE" != "tag" || "$REF_NAME" != "$INPUT_TAG" ]]; then
              echo "dry-run is off: run this workflow on the tag $INPUT_TAG, not on $REF_NAME" >&2
              exit 1
            fi
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Require the commit to be on main or the release PR branch
        if: ${{ steps.mode.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          if ! git branch -r --contains "$GITHUB_SHA" | grep -E '^\s*origin/(main|release-please--)'; then
            echo "candidate commit is not on main or a release-please branch" >&2
            exit 1
          fi

  evals:
    name: Offline evals and migration end-to-end
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest@0.9.152

      - name: Set the candidate version
        env:
          VERSION: ${{ needs.validate.outputs.cargo-version }}
        run: python3 scripts/set_workspace_version.py "$VERSION"

      # --no-tests=fail: a suite that does not exist yet blocks the candidate.
      - name: Offline accuracy gate
        run: cargo nextest run --workspace --no-tests=fail -E 'test(/^accuracy::/)'

      - name: Migration end-to-end
        run: cargo nextest run --workspace --no-tests=fail -E 'test(/^migration_e2e::/)'

  wheels:
    name: Wheels
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/wheels.yml
    with:
      version: ${{ needs.validate.outputs.cargo-version }}

  # One native runner per target, so cargo-dist needs no cross-compile wrapper.
  # The SBOM is a global artifact in cargo-dist and is left out of candidates.
  archives:
    name: Archive (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"

      - name: Install musl tools
        if: ${{ endsWith(matrix.target, '-musl') }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0
        env:
          BINSTALL_DISABLE_TELEMETRY: "true"

      - name: Install cargo-dist and cargo-auditable
        shell: bash
        run: cargo binstall cargo-dist@0.34.0 cargo-auditable --no-confirm

      - name: Set the candidate version
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.cargo-version }}
        run: uv run --no-project python scripts/set_workspace_version.py "$VERSION"

      - name: Build the archive
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.cargo-version }}
          TARGET: ${{ matrix.target }}
        run: dist build --artifacts=local --target "$TARGET" --tag "v$VERSION"

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: |
            target/distrib/*.tar.xz
            target/distrib/*.zip
            target/distrib/*.sha256
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [validate, evals, wheels, archives]
    if: ${{ needs.validate.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/slopvac/${{ needs.validate.outputs.pypi-version }}/
    permissions:
      id-token: write # exchanged for a PyPI Trusted Publishing upload token
    steps:
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Check the wheel versions
        env:
          EXPECTED: ${{ needs.validate.outputs.pypi-version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          [[ ${#wheels[@]} -gt 0 ]] || { echo "no wheels downloaded" >&2; exit 1; }
          for wheel in "${wheels[@]}"; do
            [[ "$(basename "$wheel")" == slopvac-"$EXPECTED"-* ]] || { echo "unexpected wheel: $wheel" >&2; exit 1; }
          done

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Runs after the PyPI approval, so one approval covers the whole candidate.
  prerelease:
    name: GitHub prerelease
    needs: [validate, publish, wheels, archives]
    if: ${{ needs.validate.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the prerelease
      id-token: write # sign build provenance
      attestations: write
    steps:
      - name: Download archives and wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{archive,wheels}-*"
          merge-multiple: true
          path: artifacts

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.xz
            artifacts/*.zip
            artifacts/*.whl

      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PYPI_VERSION: ${{ needs.validate.outputs.pypi-version }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "slopvac $PYPI_VERSION (release candidate)" \
            --notes "Release candidate. Install with \`uvx slopvac==$PYPI_VERSION\`. Not a stable release." \
            artifacts/*
