name: Release smoke test

# Installs a published release the way users do and checks `slopvac --version`
# against the tag: from the archive (with its published sha256), from the shell
# installer, and, for stable tags, from the Homebrew tap.
#
# It can only run once a GitHub release exists. Triggers:
#   * workflow_run after "Release" succeeds on a tag push. The release.yml host
#     job undrafts the release with GITHUB_TOKEN, which emits no `release` event,
#     and a `release: published` trigger could start before the assets exist, so
#     there is deliberately no `release` trigger;
#   * workflow_dispatch with a tag, to re-test any release.
# Tags before major 3 are not built by dist, so they are skipped. Homebrew is
# checked only for the latest stable release, because the tap serves only that.
# The tag is untrusted input. It reaches shell steps only through the
# environment, and scripts/release_smoke.py validates it first.

on:
  # workflow_run starts this only after Release succeeds on a push. The jobs check out the
  # default branch, download no run artifacts, and use a read-only token.
  workflow_run: # zizmor: ignore[dangerous-triggers] see the comment above
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test, for example v3.0.0.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate the tag
    # Pull request runs of "Release" have a branch as head_branch; only tag pushes count.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      stable: ${{ steps.tag.outputs.stable }}
      dist: ${{ steps.tag.outputs.dist }}
      latest: ${{ steps.tag.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh release view --repo "$REPO" --json tagName --jq .tagName)"
          python3 scripts/release_smoke.py parse-tag "$RELEASE_TAG" --latest-tag "$latest" | tee -a "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Say what is skipped
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          DIST: ${{ steps.tag.outputs.dist }}
          STABLE: ${{ steps.tag.outputs.stable }}
          LATEST: ${{ steps.tag.outputs.latest }}
        run: |
          if [[ "$DIST" != "true" ]]; then
            echo "Skipping every install route: $RELEASE_TAG is before major 3 and dist did not build it."
          elif [[ "$STABLE" != "true" ]]; then
            echo "Skipping Homebrew: $RELEASE_TAG is a prerelease."
          elif [[ "$LATEST" != "true" ]]; then
            echo "Skipping Homebrew: $RELEASE_TAG is not the latest release, and the tap serves only the latest."
          fi

  archive:
    name: Archive on ${{ matrix.target }}
    needs: resolve
    if: needs.resolve.outputs.dist == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      REPO: ${{ github.repository }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the archive and its checksum
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPO" --dir assets \
            --pattern "slopvac-$TARGET.tar.gz" --pattern "slopvac-$TARGET.tar.gz.sha256"

      - name: Verify the published sha256
        run: |
          python3 scripts/release_smoke.py verify-sha256 \
            "assets/slopvac-$TARGET.tar.gz" "assets/slopvac-$TARGET.tar.gz.sha256"

      - name: Unpack and run
        run: |
          set -euo pipefail
          mkdir unpacked
          tar -xzf "assets/slopvac-$TARGET.tar.gz" -C unpacked
          bin="$(find unpacked -name slopvac -type f | head -n 1)"
          test -n "$bin"
          chmod +x "$bin"
          python3 scripts/release_smoke.py expect-version "$TAG" "$("$bin" --version)"

  shell-installer:
    name: Shell installer on ${{ matrix.os }}
    needs: resolve
    if: needs.resolve.outputs.dist == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      SLOPVAC_NO_MODIFY_PATH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install with slopvac-installer.sh
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPO" --dir assets --pattern slopvac-installer.sh
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          sh assets/slopvac-installer.sh
          python3 scripts/release_smoke.py expect-version "$TAG" "$("$CARGO_HOME/bin/slopvac" --version)"

  homebrew:
    name: Homebrew on ${{ matrix.os }}
    needs: resolve
    # Prerelease tags never reach the tap, and it serves only the latest release.
    if: needs.resolve.outputs.dist == 'true' && needs.resolve.outputs.latest == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tap is updated by the last job of the release, so the formula can lag
      # a few minutes behind the GitHub release.
      - name: Install with brew
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            brew update
            brew uninstall --force slopvac
            brew install slopvac/tap/slopvac
            if python3 scripts/release_smoke.py expect-version "$TAG" "$(slopvac --version)"; then
              exit 0
            fi
            echo "attempt $attempt: tap does not serve $TAG yet" >&2
            sleep 120
          done
          exit 1
