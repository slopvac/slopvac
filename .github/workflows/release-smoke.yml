name: Release smoke test

# Installs a published release the way users do and checks `slopvac --version`
# against the tag: from the archive (with its published sha256), from the shell
# and PowerShell installers, and, for stable tags, from the Homebrew tap.
#
# It can only run once a GitHub release exists. Triggers:
#   * workflow_run after "Release" succeeds on a tag push. A release created
#     with GITHUB_TOKEN does not emit a `release` event, so this is the trigger
#     that fires after a real release;
#   * release published, for a release a maintainer creates by hand;
#   * workflow_dispatch with a tag, to re-test any release.
# The tag is untrusted input. It reaches shell steps only through the
# environment, and scripts/release_smoke.py validates it first.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test, for example v3.0.0.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ inputs.tag || github.event.release.tag_name || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate the tag
    # Pull request runs of "Release" have a branch as head_branch; only tag pushes count.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      stable: ${{ steps.tag.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          python3 scripts/release_smoke.py parse-tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  archive:
    name: Archive on ${{ matrix.target }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, ext: tar.xz, exe: "" }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, ext: tar.xz, exe: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.xz, exe: "" }
          - { os: macos-15, target: aarch64-apple-darwin, ext: tar.xz, exe: "" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, ext: tar.xz, exe: "" }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, ext: zip, exe: .exe }
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      REPO: ${{ github.repository }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}
      EXE: ${{ matrix.exe }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the archive and its checksum
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPO" --dir assets \
            --pattern "slopvac-$TARGET.$EXT" --pattern "slopvac-$TARGET.$EXT.sha256"

      - name: Verify the published sha256
        run: python3 scripts/release_smoke.py verify-sha256 "assets/slopvac-$TARGET.$EXT" "assets/slopvac-$TARGET.$EXT.sha256"

      - name: Unpack and run
        run: |
          set -euo pipefail
          mkdir unpacked
          if [[ "$EXT" == "zip" ]]; then
            python3 -m zipfile -e "assets/slopvac-$TARGET.$EXT" unpacked
          else
            tar -xJf "assets/slopvac-$TARGET.$EXT" -C unpacked
          fi
          bin="$(find unpacked -name "slopvac$EXE" -type f | head -n 1)"
          test -n "$bin"
          chmod +x "$bin"
          python3 scripts/release_smoke.py expect-version "$TAG" "$("$bin" --version)"

  shell-installer:
    name: Shell installer on ${{ matrix.os }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      SLOPVAC_NO_MODIFY_PATH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install with slopvac-installer.sh
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPO" --dir assets --pattern slopvac-installer.sh
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          sh assets/slopvac-installer.sh
          python3 scripts/release_smoke.py expect-version "$TAG" "$("$CARGO_HOME/bin/slopvac" --version)"

  powershell-installer:
    name: PowerShell installer on Windows
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      SLOPVAC_NO_MODIFY_PATH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install with slopvac-installer.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:TAG --repo $env:REPO --dir assets --pattern slopvac-installer.ps1
          $env:CARGO_HOME = Join-Path $env:RUNNER_TEMP 'cargo-home'
          & ./assets/slopvac-installer.ps1
          $version = & (Join-Path $env:CARGO_HOME 'bin/slopvac.exe') --version
          python scripts/release_smoke.py expect-version $env:TAG "$version"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  homebrew:
    name: Homebrew on ${{ matrix.os }}
    needs: resolve
    # Prerelease tags never reach the tap.
    if: needs.resolve.outputs.stable == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tap is updated by the last job of the release, so the formula can lag
      # a few minutes behind the GitHub release.
      - name: Install with brew
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            brew update
            brew uninstall --force slopvac
            brew install srobroek/tap/slopvac
            if python3 scripts/release_smoke.py expect-version "$TAG" "$(slopvac --version)"; then
              exit 0
            fi
            echo "attempt $attempt: tap does not serve $TAG yet" >&2
            sleep 120
          done
          exit 1
