name: Docs site build
# Generates the reference pages, lints the generated Markdown, builds the Starlight site,
# adds the rustdoc output, and checks internal links. Called from test.yml when the
# docs-site path class matches (.github/ci-paths.yml owns the paths) and builds only.
# docs-deploy.yml calls it with upload set and publishes the artifact to GitHub Pages
# from main. This workflow holds no Pages permissions.
on:
  workflow_call:
    inputs:
      upload:
        description: Upload the built site as the Pages artifact.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the docs site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: bash scripts/ci/install-rust-toolchain.sh

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # Keep the version in step with mise.toml.
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The caller's event applies here: a push to main skips the test, because the
      # merge-group run already ran it on this tree, and still builds the site.
      - name: Test the generator
        if: github.event_name != 'push'
        run: uv run --extra dev pytest tests/docs
      # The pages go outside the checkout. The linter skips ignored paths, and
      # build/ is ignored.
      - name: Generate the pages
        run: >-
          uv run python scripts/docs/build_site.py
          --out "$RUNNER_TEMP/site-src" --starlight site
      - name: Build the slopvac binary
        run: cargo build --locked -p slopvac
      # The step fails on exit 1 (a gate failed) and on exit 2 (the run was incomplete or
      # the invocation was invalid). Exit 2 is never a pass. The step prints the real exit
      # code and re-raises it. The pages sit outside the checkout; the binary lints them
      # and reports them as <external>/<file>.
      - name: Lint the generated Markdown
        env:
          SLOPVAC_NO_UPDATE_CHECK: "1"
          SLOPVAC_OFFLINE: "1"
        run: |
          set -uo pipefail
          status=0
          target/debug/slopvac lint "$RUNNER_TEMP/site-src" \
            --config docs/site-lint.toml || status=$?
          echo "slopvac exited $status"
          exit "$status"
      - name: Build the site
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build
      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Add rustdoc to the site
        run: |
          rm -rf site/dist/api
          cp -R target/doc site/dist/api
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0
      - name: Install lychee
        run: cargo binstall lychee@0.24.2 --no-confirm
      # The site is built for the /slopvac base path. A symlink gives lychee a root
      # where /slopvac/... resolves. Offline mode checks internal links only.
      - name: Check internal links
        run: |
          set -euo pipefail
          base="$(python3 -c 'import json; print(json.load(open("site/generated/site.json"))["base"].strip("/"))')"
          mkdir -p "$RUNNER_TEMP/lychee-root"
          ln -sfn "$PWD/site/dist" "$RUNNER_TEMP/lychee-root/$base"
          lychee --offline --no-progress --root-dir "$RUNNER_TEMP/lychee-root" \
            "$RUNNER_TEMP/lychee-root/$base/index.html" \
            "$RUNNER_TEMP/lychee-root/$base/v3/**/*.html"
      - name: Upload the Pages artifact
        if: ${{ inputs.upload }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
