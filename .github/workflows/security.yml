name: Security

on:
  workflow_call:
    inputs:
      code:
        required: false
        type: boolean
        default: false
      dependencies:
        required: false
        type: boolean
        default: false
      filesystem:
        required: false
        type: boolean
        default: false
      secrets:
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  dependency-review:
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && inputs.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Only read for events other than pull_request; empty on a pull request.
          base-ref: ${{ github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.merge_group.head_sha }}

  trufflehog:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.secrets }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # fetch-depth: 0 pulled every head and tag (hundreds of MiB) and stalled
      # past the job timeout before any scan began. Fetch only the history of the
      # commits under test, deepening until their merge base is in, and fail
      # unless every commit in the scanned range is present. Scheduled and manual
      # runs still scan the full history.
      - name: Fetch the commits under test
        id: range
        timeout-minutes: 11
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          BASE=""
          HEAD=""
          case "$EVENT_NAME" in
            pull_request) BASE="$PR_BASE"; HEAD="$PR_HEAD" ;;
            merge_group) BASE="$MG_BASE"; HEAD="$MG_HEAD" ;;
            push)
              if [[ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
                BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
              fi
              ;;
          esac
          emit() { printf 'base=%s\nhead=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          unshallow() { timeout 600 git fetch --no-tags --no-recurse-submodules --unshallow origin; }
          if [[ -z "$BASE" ]]; then
            # schedule, workflow_dispatch, or a push that creates a branch.
            unshallow
            emit "" ""
            exit 0
          fi
          for sha in "$BASE" "$HEAD"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::not a 40-hex commit id: $sha"
              exit 1
            fi
          done
          # The base of a pull request is the tip of its target branch, which the
          # head often does not contain; scan from the merge base. For a push or a
          # queue entry the base is an ancestor, so the merge base is the base.
          # A merge base alone is not enough: a merge of the target branch into the
          # head exposes it at a shallow depth while older commits stay cut off.
          # check_range succeeds only when every commit in MB..HEAD is present.
          MB=""
          REASON=""
          KIND=missing
          check_range() {
            KIND=missing
            REASON="no merge base between $BASE and $HEAD"
            MB="$(git merge-base "$BASE" "$HEAD")" || return 1
            git cat-file -e "$MB^{commit}" || return 1
            git cat-file -e "$HEAD^{commit}" || return 1
            RANGE="$(git rev-list "$MB..$HEAD")" || return 1
            SHALLOW="$(git rev-parse --git-path shallow)"
            if [[ -n "$RANGE" && -f "$SHALLOW" ]] \
              && grep -Fxqf <(printf '%s\n' "$RANGE") "$SHALLOW"; then
              KIND=incomplete
              REASON="history of $MB..$HEAD is incomplete (shallow boundary inside the range)"
              return 1
            fi
          }
          found=""
          for depth in 50 200 1000; do
            if timeout 300 git fetch --no-tags --no-recurse-submodules --depth="$depth" origin "$BASE" "$HEAD" \
              && check_range; then
              found=1
              break
            fi
            echo "::warning::$REASON at depth $depth; deepening"
          done
          if [[ -z "$found" ]]; then
            unshallow
            KIND=missing
            REASON="cannot fetch $BASE and $HEAD"
            if timeout 300 git fetch --no-tags --no-recurse-submodules origin "$BASE" "$HEAD" \
              && check_range; then
              :
            elif [[ "$EVENT_NAME" == "push" && "$KIND" == "missing" ]]; then
              # A force push can leave the old tip unreachable; scan all history.
              echo "::warning::previous tip is unavailable; scanning all history"
              emit "" ""
              exit 0
            else
              echo "::error::$REASON"
              exit 1
            fi
          fi
          emit "$MB" "$HEAD"
      - name: Scan pull request diff
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          path: ./
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          version: 3.99.8
          extra_args: --results=verified
      # A queue entry has no pull_request payload; without an explicit range the
      # action would scan the whole history.
      - name: Scan merge queue entry
        if: github.event_name == 'merge_group'
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          path: ./
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          version: 3.99.8
          extra_args: --results=verified
      - name: Scan pushed commits
        if: >-
          github.event_name != 'pull_request' &&
          github.event_name != 'merge_group' &&
          github.event_name != 'schedule' &&
          github.event_name != 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          path: ./
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          version: 3.99.8
          extra_args: --results=verified
      - name: Scan full tree
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          path: ./
          version: 3.99.8
          extra_args: --results=verified

  codeql:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.code }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, rust]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  osv:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan uv.lock
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            --lockfile=uv.lock
      - name: Create SARIF report
        if: always()
        uses: google/osv-scanner-action/osv-reporter-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --output=osv-results.sarif
            --new=osv-results.json
            --gh-annotations=true
            --fail-on-vuln=true
      - name: Upload OSV SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: osv-results.sarif

  trivy:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.filesystem }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - name: Print Trivy findings
        if: failure()
        run: |
          jq -r '
            .runs[].results[]?
            | "\(.ruleId) [\(.level)] \(.message.text | split("\n")[0])"
              + " @ \(.locations[0].physicalLocation.artifactLocation.uri // "?")"
          ' trivy-results.sarif
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif

  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: [dependency-review, trufflehog, codeql, osv, trivy]
    if: always()
    steps:
      - name: Verify required scanners and valid skips
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          CODE: ${{ inputs.code }}
          DEPENDENCIES: ${{ inputs.dependencies }}
          FILESYSTEM: ${{ inputs.filesystem }}
          SECRETS: ${{ inputs.secrets }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["RESULTS"])
          full = os.environ["EVENT_NAME"] in {"schedule", "workflow_dispatch"}

          def flag(name):
              return os.environ.get(name, "").lower() == "true"

          expected = {
              "dependency-review": os.environ["EVENT_NAME"] in {"pull_request", "merge_group"} and flag("DEPENDENCIES"),
              "trufflehog": full or flag("SECRETS"),
              "codeql": full or flag("CODE"),
              "osv": full or flag("DEPENDENCIES"),
              "trivy": full or flag("FILESYSTEM"),
          }

          problems = []
          for name, should_run in expected.items():
              actual = needs[name]["result"]
              wanted = "success" if should_run else "skipped"
              if actual != wanted:
                  problems.append(f"{name}: got {actual}, expected {wanted}")
              else:
                  print(f"{name}: {actual} (expected)")

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)

          print("security scanners ran or skipped exactly as classified")
          PY
