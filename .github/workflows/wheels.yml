name: Wheels

# Builds the slopvac binary wheels with maturin and smoke-tests each one with uv.
# It never publishes. Release workflows call it with `workflow_call` and publish
# the `wheels-*` artifacts themselves.

on:
  workflow_call:
    inputs:
      version:
        description: "Cargo version to build instead of the committed one, for release candidates."
        type: string
        default: ""
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/wheels.yml"
      - "crates/slopvac/pyproject.toml"
      - "crates/slopvac/PYPI.md"

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            smoke: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            smoke: true
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: auto
            smoke: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: auto
            smoke: true
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            smoke: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set the candidate version
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: uv run --no-project python scripts/set_workspace_version.py "$VERSION"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --manifest-path crates/slopvac/Cargo.toml --out wheelhouse

      - name: Smoke test with uvx
        if: ${{ matrix.smoke }}
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls wheelhouse/slopvac-*.whl)"
          uvx --no-cache --from "$wheel" slopvac --help

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: wheelhouse/*.whl
          if-no-files-found: error
