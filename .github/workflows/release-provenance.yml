name: Release provenance

# Reusable gate for stable releases (bead slopvac-8l4.13.4). The cargo-dist
# release workflow (release.yml) and the PyPI workflow (publish-pypi.yml) both
# call it, so a stable `vX.Y.Z` tag cannot publish unless a passed candidate
# (rc/vX.Y.Z-rc.N, a push run of publish-pypi.yml) tested the same tree.
# Both callers only start on plain vX.Y.Z tags.

# A maintainer can also dispatch it with a tag to run only the tag ruleset check,
# token mint included. That path skips the candidate checks and publishes nothing.
# A caller that publishes needs the candidate check, so `require-candidate` defaults
# on: the check runs on a tag, and a final step fails the job when it did not pass
# (for example a call on a branch). Only a run that cannot publish, the release plan
# on a pull request, passes false. The direct dispatch declares no such input, so it
# runs the ruleset check alone.
on:
  workflow_call:
    inputs:
      require-candidate:
        description: Fail unless the passed-candidate check ran and passed.
        type: boolean
        default: true
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: >-
          Private key of the release GitHub App, whose installation on this
          repository needs Administration: read so the tag ruleset check can see
          bypass actors.
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) for the ruleset check; nothing is published.
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  provenance:
    name: Stable release has a passed candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check the candidate
        id: candidate
        # Pull requests run the release plan too; only a tag can publish. The
        # direct dispatch has no `require-candidate` input and skips this step.
        if: ${{ inputs.require-candidate && github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_provenance.py check-stable "$TAG" --repo "$REPO" --sha "$EVENT_SHA"

      # GitHub returns bypass_actors only to a token that can administer the
      # repository, which GITHUB_TOKEN cannot. The release App's installation token
      # is scoped to this repository with Administration: read and nothing else.
      - name: Mint the ruleset read token
        id: ruleset-token
        if: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read

      - name: Explain a failed token mint
        if: ${{ failure() && steps.ruleset-token.outcome == 'failure' }}
        run: |
          echo "::error::Could not mint the ruleset read token."
          echo "::error::The release app needs Administration: Read-only on the slopvac/slopvac installation."
          exit 1

      # A tag-writer could move the tag after this check. Only a repository ruleset
      # makes version tags immutable, and a maintainer must create it. Read-only;
      # fails closed, also when the token cannot read rulesets. The script checks
      # that TAG is vX.Y.Z.
      - name: Require an immutable tag ruleset
        if: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.ruleset-token.outputs.token }}
        run: |
          python3 scripts/release_ruleset.py check "$TAG" --repo "$REPO"

      # The steps above skip on a branch. A caller that required the candidate
      # check must not pass on a skip, so fail closed.
      - name: Fail when a required candidate check did not pass
        if: ${{ inputs.require-candidate && steps.candidate.outcome != 'success' }}
        run: |
          echo "::error::The passed-candidate check was required but did not run on a tag."
          exit 1
