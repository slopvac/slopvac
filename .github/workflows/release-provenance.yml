name: Release provenance

# Reusable gate for stable releases (bead slopvac-8l4.13.4). The cargo-dist
# release workflow calls it as a plan job, so a stable `vX.Y.Z` tag cannot
# publish unless a passed candidate (rc/vX.Y.Z-rc.N) tested the same tree.
# The release workflow only starts on plain vX.Y.Z tags.

on:
  workflow_call:
    secrets:
      RULESET_READ_TOKEN:
        description: >-
          Fine-grained token for this repository with Administration: read, so the
          tag ruleset check can see bypass actors. Optional; without it the check
          fails closed.
        required: false

permissions:
  contents: read
  actions: read

jobs:
  provenance:
    name: Stable release has a passed candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check the candidate
        # Pull requests run the release plan too; only a tag push can publish.
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_provenance.py check-stable "$TAG" --repo "$REPO" --sha "$EVENT_SHA"

      # A tag-writer could move the tag after this check. Only a repository ruleset
      # makes version tags immutable, and a maintainer must create it. Read-only;
      # fails closed, also when the token cannot read rulesets.
      - name: Require an immutable tag ruleset
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.RULESET_READ_TOKEN || github.token }}
        run: |
          python3 scripts/release_ruleset.py check "$TAG" --repo "$REPO"
