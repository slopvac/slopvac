name: CLA check

# GitHub runs workflow_run from the default branch, in the base repository's context. The event data
# (branch, sha, repository) is untrusted: scripts/cla_check.py reads it from the event file, treats
# it only as a lookup key, and posts the result as a check run named "CLA" through the CLA app.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] default branch only, run data is a lookup key
    workflows: [CLA]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    name: Post the CLA check run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mint the CLA app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CLA_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-pull-requests: read
          permission-contents: read

      - name: Evaluate and post the CLA check run
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 -B scripts/cla_check.py
