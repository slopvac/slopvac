name: Rust fuzzing

# Nightly-toolchain cargo-fuzz run of each target in fuzz/ for a bounded time.
# Crashing inputs upload as artifacts. It never gates a pull request or the
# Tests job (slopvac-8l4.14.12).

on:
  schedule:
    - cron: "29 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        required: false
        default: "300"
        type: string

permissions:
  contents: read

concurrency:
  group: rust-fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  NIGHTLY: nightly-2026-11-01

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [frontmatter_spans, config_load, parse_document]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: bash scripts/ci/install-rust-toolchain.sh

      # Pinned to a date so a nightly regression cannot fail the schedule.
      # Bump it together with a green manual run.
      - name: Install the nightly toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: fuzz-${{ matrix.target }}

      - name: Install cargo-fuzz and cargo-deny
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-fuzz@0.13.2,cargo-deny@0.20.2

      - name: Check the fuzz dependencies
        run: cargo deny --manifest-path fuzz/Cargo.toml --locked check licenses bans sources

      # The config_load harness asserts that its scratch directory is owner-only;
      # a permissive umask must not widen it.
      - name: Check the scratch directory under umask 000
        if: matrix.target == 'config_load'
        run: >-
          bash -c 'umask 000; cargo "+$NIGHTLY" fuzz run config_load -- -runs=10'

      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: >-
          cargo "+$NIGHTLY" fuzz run "$TARGET" --
          -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=4096

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
