# Scenarios for the installed Rust binary, mirroring scenarios.toml (2.x).
# `{root}` expands to the repository root. A scenario whose command exits with a
# code outside accept_exits is recorded as "error" and not measured. Arguments
# follow the clap tree in crates/slopvac/src/cli.rs; tests/test_binary_bench.py
# runs every scenario against a built binary and rejects exit 2.
#
# No plugin start-up scenario yet: `slopvac plugins` and `packs` still exit 2
# with command-not-wired (slopvac-8l4.9). The scenario is tracked in the bead
# that wires them.

[[scenario]]
name = "startup --version"
args = ["--version"]

[[scenario]]
name = "startup rules json"
args = ["rules", "--format", "json"]

[[scenario]]
name = "startup rules judgement json"
args = ["rules", "--kind", "judgement", "--format", "json"]

[[scenario]]
name = "startup explain"
args = ["explain", "core:ai-residue.chat-leakage"]

[[scenario]]
name = "lint fixture warm"
args = ["lint", "{root}/scripts/perf/fixtures/clean.md"]
accept_exits = [0, 1]

[[scenario]]
name = "lint fixture cold"
args = ["lint", "{root}/scripts/perf/fixtures/clean.md"]
accept_exits = [0, 1]
cold = true

[[scenario]]
name = "lint README warm"
args = ["lint", "{root}/packages/slopvac-lint/README.md"]
accept_exits = [0, 1]

[[scenario]]
name = "lint README cold"
args = ["lint", "{root}/packages/slopvac-lint/README.md"]
accept_exits = [0, 1]
cold = true

[[scenario]]
name = "lint comments source"
args = ["lint", "--mode", "code-comments", "{root}/scripts/perf/fixtures/comments/example.py"]
accept_exits = [0, 1]
