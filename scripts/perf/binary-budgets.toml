# Numeric budgets for scripts/perf/binary_bench.py (slopvac-8l4.14.6).
# Upper bounds, checked by `binary_bench.py run --budgets FILE [--enforce]`.
# This file only records them; no workflow enforces them yet (slopvac-8l4.14.5
# gates releases on them).
#
# Measured: release build (`cargo build --release -p slopvac`, version 0.0.0,
# 3.0 work in progress), Apple M4 Pro, 14 cores, macOS arm64, 30 runs after
# 5 warm-up runs, on a busy developer machine, 2026-11-16.
# Headroom rule, so shared CI runners (slower, noisier) pass:
#   median_ms     = max(100, 5 x measured median), rounded up to 25
#   p95_ms        = max(250, 5 x measured p95), rounded up to 50
#   peak_rss_kb   = max(16384, 4 x measured peak), rounded up to 1024
#   binary_size_bytes = 2 x measured size, rounded up to 1 MiB
# Re-derive them from fresh measurements when the engine lands real work
# (measured lint peak RSS is near the --version baseline) and tighten.
# Every scenario in binary-scenarios.toml needs an entry (tests enforce it).

binary_size_bytes = 18874368

[scenario."startup --version"]
median_ms = 275  # measured 51.986
p95_ms = 650  # measured 124.145
peak_rss_kb = 16384  # measured 2928

