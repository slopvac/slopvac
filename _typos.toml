# This repository's source is largely REGEX over English, so a spell checker sees
# it wrong twice over. Both classes below are false positives, and every entry was
# triaged from a real run rather than added defensively.

[files]
# CHANGELOG entries carry commit SHAs, and a 7-hex abbreviation lands on a word
# often enough (`caf391e` -> `calf`) that the file is noise-only.
extend-exclude = [
  "CHANGELOG.md",
  # Third-party text kept verbatim as eval data, plus manifests of hashes.
  "evals/corpus/",
  "evals/manifest.json",
  "evals/defect-bank.json",
  "evals/candidates-diagrams.json",
  "packages/slopvac-lint/tests/fixtures/text_type/runbook-labels-v1.jsonl",
  # Generated Unicode tables (tools/generate_unicode.py); code-point names are not words.
  "crates/slopvac-text/src/unicode_data.rs",
  # Generated corpus (tests/fixtures/generate.py); it holds upper-, swapped- and
  # Kelvin-cased copies of rule examples on purpose.
  "crates/slopvac-rules/tests/fixtures/pattern-parity.json",
  # Generated parity fixture (tests/fixtures/generate.py): matched text is cut mid-word.
  "crates/slopvac-engine/tests/fixtures/engine-parity.json",
  # Generated patterns (tests/fixtures/generate_word_class.py) join random fragments.
  "crates/slopvac-text/tests/fixtures/word_class_differential.json",
  # Golden suite: inputs hold the misspellings and defects that rules report, and the
  # recorded parity output quotes them.
  "tests/golden/v3/",
]

[default.extend-words]
# Suffix and prefix FRAGMENTS inside character alternations. Each one is a piece of
# a word the pattern matches by ending, so "correcting" it breaks the rule:
#   (?:tion|sion|ment|ness|...)   nominalisation suffixes
#   (?:ise|ize|yse|yze)           the -ise/-ize locale pair
ment = "ment"
# `control_fpr` is the false-positive-rate key in eval scorecards.
fpr = "fpr"
ness = "ness"
ful = "ful"
ist = "ist"
ure = "ure"
yse = "yse"
mis = "mis"
nd = "nd"
ned = "ned"
fter = "fter"
struc = "struc"
utiliz = "utiliz"
retrie = "retrie"
validat = "validat"
deprecat = "deprecat"

# Crate name `flate2` (gzip/deflate) cited in the v3 design doc.
flate = "flate"

# A real word with two accepted spellings, and this one is the spelling used
# throughout. Not a typo to correct.
unparseable = "unparseable"

# Cited author surname (Sclar et al. 2023), a statistics term, and the MUC coreference
# metric, all in the rubric research record.
Sclar = "Sclar"
nonsignificant = "nonsignificant"
MUC = "MUC"

# Product name (Azure Kubernetes Service) in the bundled terms list,
# crates/slopvac-terms/data/builtin.toml.
AKS = "AKS"

# `Caf\u{e9}` escapes in slopvac-pos test strings.
Caf = "Caf"

# Mixed-case YAML boolean probe in frontmatter-spans tests.
[default.extend-identifiers]
TrUe = "TrUe"

[default]
# Abbreviated commit SHAs cited in the research record (`cace892253`, `ba...`).
extend-ignore-re = ["\\b[0-9a-f]{10,40}\\b"]
