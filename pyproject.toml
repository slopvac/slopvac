[project]
name = "slopvac-workspace"
version = "0.0.0"
description = "Repository workspace configuration for Slopvac"
requires-python = ">=3.11"
dependencies = ["slopvac", "slopvac-plugin[conformance]"]

[project.optional-dependencies]
dev = [
  "docutils>=0.21",
  "pre-commit==4.7.0",
  "prek==0.5.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[tool.uv]
package = false

[tool.uv.sources]
slopvac = { workspace = true }
slopvac-plugin = { workspace = true }

[tool.uv.workspace]
members = ["packages/slopvac-lint", "packages/slopvac-plugin"]

[tool.pytest.ini_options]
testpaths = [
  "packages/slopvac-lint/tests",
  "packages/slopvac-plugin/tests",
  "tests",
]
addopts = "-q"
pythonpath = [".", "packages/slopvac-plugin/src"]

[dependency-groups]
profile = [
  "line-profiler>=5.1.0",
  "memray>=1.20.0",
  "py-spy>=0.4.2",
  "pyinstrument>=5.1.3",
  "scalene>=2.3.0",
  "tuna>=0.5.15",
  "viztracer>=1.1.1",
]
