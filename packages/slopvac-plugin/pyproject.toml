[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slopvac-plugin"
version = "0.1.0"
description = "Python SDK and conformance suite for slopvac plugin protocol v1."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Sjors Robroek" }]
keywords = ["slopvac", "plugin", "json-rpc", "conformance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# The SDK uses the standard library only.
dependencies = []

[project.optional-dependencies]
# The conformance suite checks plugin replies against the JSON Schema.
conformance = ["jsonschema>=4.18"]

[project.scripts]
slopvac-plugin-conformance = "slopvac_plugin.conformance.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slopvac_plugin"]

# The schemas are the contract, so the wheel carries a copy of them.
[tool.hatch.build.targets.wheel.force-include]
"../../schemas/v3/plugin-protocol.schema.json" = "slopvac_plugin/schemas/plugin-protocol.schema.json"
"../../schemas/v3/common.schema.json" = "slopvac_plugin/schemas/common.schema.json"
