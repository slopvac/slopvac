# Test code may unwrap, panic, index and print: a failing test is the signal.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

# A split of prose that has no limit builds a record for every sentence before any budget
# applies, so a document of one-character sentences can exhaust memory (CWE-400). Callers
# use the limited forms with the document's remaining budget. Allow one of these only where
# the input is bounded by construction, with a scoped `#[expect]` that says why.
disallowed-methods = [
  { path = "slopvac_text::sentences::split_sentences", reason = "builds every sentence with no limit; use `split_sentences_within` with the document's remaining sentence budget" },
  { path = "slopvac_context::view::split_sentences", reason = "builds every sentence with no limit; use `split_sentences_within` with the document's remaining sentence budget" },
]
