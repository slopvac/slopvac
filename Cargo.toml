# Rust workspace for slopvac 3.0. It sits beside the Python package
# (packages/slopvac-lint), which stays the reference implementation until the
# golden suite passes. Crates live under crates/ so the Python layout is untouched.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Stable is 1.99; the floor trails it by two minor releases so contributors on a
# slightly older toolchain still build. rust-toolchain.toml pins the dev toolchain.
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/srobroek/slopvac"
publish = false

[workspace.dependencies]
slopvac-model = { path = "crates/slopvac-model" }
slopvac-config = { path = "crates/slopvac-config" }
slopvac-parse = { path = "crates/slopvac-parse" }
slopvac-text = { path = "crates/slopvac-text" }
slopvac-rules = { path = "crates/slopvac-rules" }
slopvac-engine = { path = "crates/slopvac-engine" }
slopvac-report = { path = "crates/slopvac-report" }
slopvac-plugins = { path = "crates/slopvac-plugins" }
slopvac-lsp = { path = "crates/slopvac-lsp" }
slopvac-context = { path = "crates/slopvac-context" }
pcre2 = "0.2"
serde-saphyr = "2"
slopvac-migrate = { path = "crates/slopvac-migrate" }
slopvac-styles = { path = "crates/slopvac-styles" }
slopvac-diagrams = { path = "crates/slopvac-diagrams" }
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
slopvac-terms = { path = "crates/slopvac-terms" }
base64 = "0.23"
flate2 = "1.1"
roxmltree = "0.21"
clap = { version = "4.6", features = ["derive"] }
slopvac-agents = { path = "crates/slopvac-agents" }
cap-std = "4"
pulldown-cmark = { version = "0.13", default-features = false }
similar = "3"
toml_edit = "0.25"
tempfile = "3"
slopvac-comments = { path = "crates/slopvac-comments" }
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-clojure-orchard = "0.2"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.3"
tree-sitter-elixir = "0.3"
tree-sitter-fsharp = "0.3"
tree-sitter-go = "0.25"
tree-sitter-haskell = "0.24"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-julia = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-less = "1"
tree-sitter-lua = "0.5"
tree-sitter-perl = "1.1"
tree-sitter-php = "0.25"
tree-sitter-powershell = "0.26"
tree-sitter-proto = "0.6"
tree-sitter-python = "0.25"
tree-sitter-r = "1.3"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-scss = "1"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
missing_crate_level_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that mostly add noise for a text-processing codebase.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
