# Rust workspace for slopvac 3.0. It sits beside the Python package
# (packages/slopvac-lint), which stays the reference implementation until the
# golden suite passes. Crates live under crates/ so the Python layout is untouched.
[workspace]
resolver = "3"
members = ["crates/*"]
# The cargo-fuzz harness needs nightly and is built only by `just fuzz`.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Stable is 1.99; the floor trails it by two minor releases so contributors on a
# slightly older toolchain still build. rust-toolchain.toml pins the dev toolchain.
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/srobroek/slopvac"
homepage = "https://github.com/srobroek/slopvac"
publish = false

[workspace.dependencies]
annotate-snippets = "0.12.18"
base64 = "0.23"
cap-fs-ext = "4"
cap-std = "4"
caseless = "0.2"
clap = "4.6"
crossbeam-channel = "0.5"
flate2 = "1.1"
frontmatter-spans = { path = "crates/frontmatter-spans" }
globset = "0.4"
html5ever = "0.40"
html5gum = "0.9"
ignore = "0.4"
insta = "1.49"
# No default features: they pull reqwest and tokio, which ADR 0001 bans (cargo-deny).
jsonschema = { version = "0.61.2", default-features = false }
lsp-server = "0.10"
lsp-types = "0.97"
markdown = "1"
markup5ever_rcdom = "0.40"
minijinja = "3"
minisign = { version = "0.10", default-features = false }
minisign-verify = "0.3"
# Pinned: 0.2.10 vendors PCRE2 10.46; the rules need >= 10.43 (slopvac-8l4.3.20).
pcre2-sys = "=0.2.10"
proptest = "1.12.0"
pulldown-cmark = { version = "0.13", default-features = false }
rayon = "1.11"
roxmltree = "0.21"
rstest = "0.28"
rustix = { version = "1", default-features = false, features = [
  "std",
  "process",
] }
saphyr = "0.3"
# The event parser behind saphyr, pinned to the version saphyr 0.3 uses.
saphyr-parser = "0.3.4"
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
sha2 = "0.10"
similar = "3"
slopvac-agents = { path = "crates/slopvac-agents" }
slopvac-config = { path = "crates/slopvac-config" }
slopvac-context = { path = "crates/slopvac-context" }
slopvac-diagrams = { path = "crates/slopvac-diagrams" }
slopvac-engine = { path = "crates/slopvac-engine" }
slopvac-lsp = { path = "crates/slopvac-lsp" }
slopvac-migrate = { path = "crates/slopvac-migrate" }
slopvac-model = { path = "crates/slopvac-model" }
slopvac-parse = { path = "crates/slopvac-parse" }
slopvac-pcre2 = { path = "crates/slopvac-pcre2" }
slopvac-plugins = { path = "crates/slopvac-plugins" }
slopvac-pos = { path = "crates/slopvac-pos" }
slopvac-report = { path = "crates/slopvac-report" }
slopvac-rules = { path = "crates/slopvac-rules" }
slopvac-sanitize = { path = "crates/slopvac-sanitize" }
slopvac-styles = { path = "crates/slopvac-styles" }
slopvac-terms = { path = "crates/slopvac-terms" }
slopvac-text = { path = "crates/slopvac-text" }
slopvac-update = { path = "crates/slopvac-update" }
snapbox = "1.2"
strsim = "0.11.1"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
# Libraries log through `tracing` and never install a subscriber.
tracing = "0.1.44"
unicode-normalization = "0.1"
ureq = { version = "3.5", default-features = false, features = [
  "rustls",
  "platform-verifier",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
missing_crate_level_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allowed pedantic lints (each with its reason).
module_name_repetitions = "allow" # reason: crate-prefixed type names read better at call sites in a text-processing codebase
missing_errors_doc = "allow"      # reason: error enums are documented on the type, not on every fallible fn
missing_panics_doc = "allow"      # reason: panics are banned by lint instead; docs would duplicate that
# Restriction and nursery lints that guard against panics and silent failure.
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
mem_forget = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
clone_on_ref_ptr = "warn"
redundant_type_annotations = "warn"
redundant_clone = "warn"
use_debug = "warn"
string_add = "warn"
needless_pass_by_ref_mut = "warn"
expect_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
str_to_string = "warn"
wildcard_enum_match_arm = "warn"
as_conversions = "warn"
significant_drop_tightening = "warn"
option_if_let_else = "warn"
# Span and parser crates opt in with `#![warn(...)]` in lib.rs; the rest of the workspace
# does not index, slice or do offset arithmetic on untrusted text.
indexing_slicing = "allow"          # reason: span crates opt in
string_slice = "allow"              # reason: span crates opt in
arithmetic_side_effects = "allow"   # reason: span crates opt in
# Skipped restriction lints.
missing_docs_in_private_items = "allow" # reason: rustc `missing_docs` covers the public API; private docs are noise
missing_assert_message = "allow"        # reason: assertions in tests name the behaviour through the test name
undocumented_unsafe_blocks = "allow"    # reason: `unsafe_code` is forbidden here; slopvac-pcre2 denies this lint itself
impl_trait_in_params = "allow"          # reason: `impl Trait` arguments are idiomatic and read better than generics
renamed_function_params = "allow"       # reason: trait impls rename parameters to fit the implementing type

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Profile for cargo-dist release builds.
[profile.dist]
inherits = "release"
